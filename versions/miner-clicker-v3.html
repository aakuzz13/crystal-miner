<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0705">
<title>Кристальная Шахта — Гримуар Забоя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<!-- Yandex Games SDK: /sdk.js only resolves when this build is hosted on
     Yandex's servers (relative path, per their upload docs). Opened
     standalone or from any other host, the script 404s harmlessly and
     initYandexSDK() below no-ops — the game runs the same either way. -->
<script>
  function initYandexSDK(){
    if(typeof YaGames === "undefined") return;
    YaGames.init().then(function(ysdk){
      window.ysdk = ysdk;
      // Platform requirement 2.14: query the player's language from the SDK
      // instead of assuming one. All game text is Russian-only for now (no
      // translated strings exist yet), so this doesn't change what's shown —
      // it just stops hardcoding <html lang> and makes the detected value
      // available (window.__yandexLang) for real localization later.
      var lang = ysdk.environment && ysdk.environment.i18n && ysdk.environment.i18n.lang;
      if(lang){
        window.__yandexLang = lang;
        document.documentElement.setAttribute("lang", lang);
      }
      if(ysdk.features && ysdk.features.LoadingAPI){
        ysdk.features.LoadingAPI.ready();
      }
      // Platform requirement 1.19.2 (Game Ready API): the game is playable
      // immediately once LoadingAPI.ready() fires, so gameplay "starts" here;
      // the main script also calls this again defensively once it boots, and
      // pairs it with GameplayAPI.stop() around tab-hidden/ad moments.
      if(ysdk.features && ysdk.features.GameplayAPI){
        ysdk.features.GameplayAPI.start();
      }
      // Platform requirement 1.9: fetch the player handle so the main game
      // script can read/write progress through ysdk.getPlayer() instead of
      // (only) localStorage. scopes:false skips the personal-data consent
      // prompt — getData/setData works for anonymous players too. Dispatched
      // as a DOM event because this <head> script runs before the game's own
      // <script> IIFE at the bottom of <body> even exists yet.
      ysdk.getPlayer({ scopes: false }).then(function(player){
        window.__yandexPlayer = player;
        window.dispatchEvent(new Event("yandex-player-ready"));
      }).catch(function(){});
    }).catch(function(){});
  }
</script>
<script async src="/sdk.js" onload="initYandexSDK()"></script>
<style>
  :root{
    --wood-dark:#2b1810;
    --wood-mid:#4a2f1c;
    --wood-light:#7a4a26;
    --parchment:#f0dfb0;
    --parchment-dark:#dcc079;
    --parchment-panel:#3a2818;
    --ink:#2a1a0e;
    --ink-dim:#9c7f4a;
    --teal:#2a8a7a;
    --teal-bright:#4fd6bd;
    --blood:#b23a2e;
    --blood-bright:#e0492f;
    --candle:#f0932f;
    --candle-bright:#ffb545;
    --common:#7fae63;    --common2:#b8e08f;
    --rare:#2f8fd4;      --rare2:#7fc4f2;
    --epic:#a13fd4;      --epic2:#d98af2;
    --legendary:#f0a92f; --legendary2:#ffd873;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:radial-gradient(ellipse at 50% 0%, #4a2f1c, #201108);
    transition:background 0.7s ease;
    font-family:'IM Fell English', Georgia, serif;
    color:var(--parchment);
  }
  #app{ display:flex; flex-direction:column; height:100%; position:relative; }

  /* warm candlelight pool centered on the scene, independent of location accent color */
  main::before{
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(circle at 50% 44%, rgba(235,185,115,.22) 0%, rgba(235,185,115,.09) 32%, transparent 62%);
  }

  /* PORTAL TRANSITION OVERLAY */
  #portal{
    position:fixed; inset:0; z-index:45; pointer-events:none; opacity:0;
    background:radial-gradient(circle at var(--px,50%) var(--py,50%), var(--portal-color,#fff) 0%, transparent 65%);
  }
  #portal.active{ animation: portalExpand 0.9s cubic-bezier(.16,.84,.44,1) forwards; }
  @keyframes portalExpand{
    0%{ clip-path: circle(0% at var(--px) var(--py)); opacity:.9; }
    60%{ opacity:.8; }
    100%{ clip-path: circle(145% at var(--px) var(--py)); opacity:0; }
  }

  /* HEADER */
  header{ position:relative; padding:12px 16px 10px; text-align:center; flex-shrink:0; }
  .icon-btn{
    position:absolute; top:8px; right:12px;
    background:linear-gradient(160deg, var(--wood-light), var(--wood-dark));
    border:1px solid #000a; border-radius:50%;
    width:34px; height:34px; font-size:1rem; color:var(--parchment);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.08);
  }
  /* The header's top-right corner has no spare room (torch-right, mute-btn
     and the wide .resource-panel already fill it edge-to-edge on narrow
     phones — stacking a second icon-btn there clipped into the resource
     panel). Anchored to the opposite screen edge instead, fixed and
     vertical-centered like #chest, so it can never collide with header
     content at any viewport width. */
  #ad-btn{
    position:fixed; top:50%; left:min(1.5vw,6px); right:auto;
    transform:translateY(-50%); z-index:60; font-size:1.1rem;
  }
  .torch{ position:absolute; top:9px; width:24px; height:24px; image-rendering:pixelated; pointer-events:none;
    filter:drop-shadow(0 0 7px rgba(217,154,78,.65)); animation:torchFlicker 1.8s ease-in-out infinite; }
  .torch-left{ left:14px; }
  .torch-right{ right:54px; animation-delay:.6s; }
  @keyframes torchFlicker{ 0%,100%{opacity:.82; transform:scale(1);} 50%{opacity:1; transform:scale(1.06);} }
  .loc-label{ font-family:'Pirata One',Georgia,serif; font-weight:400; font-size:0.92rem; color:var(--parchment-dark); letter-spacing:0.6px; }
  .loc-tagline{ font-family:'IM Fell English',serif; font-style:italic; font-size:0.7rem; color:var(--parchment-dark); opacity:.85; margin-top:2px; }
  .resource-panel{
    display:inline-block; margin-top:8px; padding:7px 22px 9px; border-radius:4px;
    background:linear-gradient(160deg, rgba(255,220,160,.08), rgba(0,0,0,.3));
    border:1px solid rgba(217,154,78,0.35);
    box-shadow:0 0 18px rgba(217,154,78,0.1) inset, 0 3px 8px rgba(0,0,0,.5);
  }
  .resource-counter{ font-family:'Pirata One',Georgia,serif; font-size:1.85rem; font-weight:400; color:var(--candle-bright); text-shadow:0 0 16px rgba(217,154,78,0.55); letter-spacing:0.5px; }
  .resource-counter span.unit{ font-size:1rem; color:var(--ink-dim); font-weight:normal; }
  .per-sec{ font-size:0.8rem; color:var(--parchment-dark); margin-top:1px; font-family:'IM Fell English',serif; font-style:italic; }

  /* TOAST */
  #toast{
    position:fixed; top:10px; left:50%; transform:translateX(-50%) translateY(-30px);
    background:linear-gradient(160deg, var(--wood-mid), var(--wood-dark)); border:1px solid rgba(217,154,78,0.3);
    color:var(--parchment); padding:9px 16px; border-radius:4px;
    font-family:'IM Fell English',serif; font-size:0.85rem; font-weight:600;
    opacity:0; transition:all 0.35s ease; pointer-events:none; white-space:nowrap; z-index:50;
    box-shadow:0 4px 10px rgba(0,0,0,.5);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* MAIN */
  main{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-height:0; }
  .ambient-particle{ position:absolute; border-radius:50%; pointer-events:none; z-index:0; animation:ambientFloat linear forwards; }
  @keyframes ambientFloat{
    0%{ transform:translateY(10px) scale(0.7); opacity:0; }
    15%{ opacity:.8; }
    85%{ opacity:.4; }
    100%{ transform:translateY(-130px) scale(0.4); opacity:0; }
  }

  #rock-wrap{
    --accent:#7c6a9c; --accent2:#a99bc4; --rockBase:#362c2a; --rockDeep:#1c1614;
    position:relative; perspective:900px;
    width:min(66vw, 250px); height:min(66vw, 250px);
    cursor:pointer; touch-action:manipulation;
  }
  #rock-wrap::before{
    content:""; position:absolute; inset:-7%; border-radius:50%; z-index:0; pointer-events:none;
    border:2px solid color-mix(in srgb, var(--accent) 45%, transparent);
    box-shadow:0 0 0 6px color-mix(in srgb, var(--accent) 10%, transparent) inset;
    transition:border-color .6s ease, box-shadow .6s ease;
  }
  #rock-glow{
    position:absolute; inset:-25%; border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, transparent 68%);
    opacity:0.28; filter:blur(18px); z-index:0; pointer-events:none;
    animation:glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse{ 0%,100%{opacity:0.18; transform:scale(0.94);} 50%{opacity:0.34; transform:scale(1.05);} }
  #rock{ position:relative; z-index:1; width:100%; height:100%; transition:transform 0.08s ease; }
  #rock-wrap:active #rock{ transform:scale(0.94); }
  #rock-wrap.shake #rock{ animation:shake 0.22s; }
  @keyframes shake{ 0%,100%{transform:translate(0,0);} 25%{transform:translate(-3px,2px) rotate(-1deg);} 75%{transform:translate(3px,-2px) rotate(1deg);} }
  #rock-wrap.flipping #rock{ animation:rockFlip 0.56s ease-in-out; }
  @keyframes rockFlip{ 0%{transform:rotateY(0deg);} 50%{transform:rotateY(92deg);} 100%{transform:rotateY(0deg);} }
  .crystal{ animation:crystalPulse 2.6s ease-in-out infinite; transform-origin:center; }
  .crystal:nth-of-type(2){ animation-delay:0.3s; }
  .crystal:nth-of-type(3){ animation-delay:0.6s; }
  .crystal:nth-of-type(4){ animation-delay:0.9s; }
  @keyframes crystalPulse{ 0%,100%{opacity:0.78;} 50%{opacity:1;} }
  .sparkle{ animation:twinkle 1.8s ease-in-out infinite; transform-origin:center; }
  @keyframes twinkle{ 0%,100%{opacity:0; transform:scale(0.4);} 50%{opacity:1; transform:scale(1);} }

  #cracksStage1 path, #cracksStage2 path{ opacity:0; transition:opacity .25s ease; }
  #rock-wrap.stage1 #cracksStage1 path{ opacity:1; }
  #rock-wrap.stage2 #cracksStage1 path, #rock-wrap.stage2 #cracksStage2 path{ opacity:1; }
  #shatterFlash{ opacity:0; }
  #rock-wrap.shatter #shatterFlash{ animation:shatterFlash .5s ease-out; }
  @keyframes shatterFlash{ 0%{opacity:0;} 12%{opacity:.9;} 100%{opacity:0;} }

  /* PICKAXE — follows the mouse cursor on pointer:fine devices */
  .pickaxe-cursor{
    position:fixed; left:0; top:0; width:64px; height:64px;
    margin-left:-8px; margin-top:-54px;
    z-index:12; pointer-events:none; opacity:0; will-change:transform;
  }
  #pickaxe{
    width:100%; height:100%;
    transform-origin:22% 88%; transform:rotate(-14deg);
    filter:drop-shadow(2px 3px 3px rgba(0,0,0,.6));
  }
  @keyframes pickaxeSwing{
    0%{ transform:rotate(-14deg); }
    26%{ transform:rotate(-72deg); }
    46%{ transform:rotate(38deg); }
    68%{ transform:rotate(18deg); }
    100%{ transform:rotate(-14deg); }
  }
  #pickaxe.swing{ animation:pickaxeSwing .4s cubic-bezier(.3,0,.2,1); }
  .has-cursor-pickaxe main{ cursor:none; }
  .has-cursor-pickaxe #rock-wrap{ cursor:none; }

  .float-num{
    position:absolute; font-size:1.25rem; font-weight:bold; color:var(--candle-bright);
    text-shadow:0 1px 3px rgba(0,0,0,0.7); pointer-events:none;
    animation:floatUp 0.9s ease-out forwards; font-family:'IM Fell English',serif; z-index:8;
  }
  @keyframes floatUp{ 0%{opacity:1; transform:translateY(0) scale(1);} 100%{opacity:0; transform:translateY(-70px) scale(1.2);} }

  .chip{ position:absolute; width:6px; height:6px; border-radius:1px; pointer-events:none; z-index:6; }
  .spark{ position:absolute; width:3px; height:3px; border-radius:50%; pointer-events:none; z-index:7; background:var(--candle-bright); box-shadow:0 0 5px var(--candle-bright); }
  .dust-chunk{ position:absolute; pointer-events:none; z-index:6; image-rendering:pixelated; }

  .ore-accent{ position:absolute; width:26px; height:26px; z-index:1; pointer-events:none; opacity:.95; filter:drop-shadow(0 0 4px rgba(0,0,0,.55)); }
  .oa1{ left:26%; top:36%; }
  .oa2{ right:22%; top:56%; }
  .rockpile-decor{ position:absolute; width:34px; height:30px; left:50%; bottom:-4%; transform:translateX(-50%); image-rendering:pixelated; opacity:.8; z-index:0; pointer-events:none; }

  /* CHEST — appears beside the ore (sized/positioned to clear #rock-wrap's
     own min(66vw,250px) box at any viewport width), never blocks clicking it */
  #chest{
    position:fixed; right:min(1.5vw,6px); top:50%; width:min(15vw,72px); height:min(12.75vw,61px);
    z-index:65; cursor:pointer;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.65));
    animation:chestBob .8s ease-in-out infinite, chestFadeIn .35s ease-out;
  }
  .has-cursor-pickaxe #chest{ cursor:none; }
  #chest.hidden{ display:none; }
  #chest.opening{ animation:none; pointer-events:none; }
  #chest.opening #chestLidGroup{ animation:chestLidOpen .35s ease-in forwards; }
  #chest.opening{ animation:chestVanish .45s ease-in .3s forwards; }
  @keyframes chestBob{
    0%,100%{ transform:translateY(-50%) translateY(0) scale(1); }
    50%{ transform:translateY(-50%) translateY(-8px) scale(1.02); }
  }
  @keyframes chestFadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes chestLidOpen{ 0%{transform:rotate(0deg);} 100%{transform:rotate(-70deg);} }
  @keyframes chestVanish{
    0%{opacity:1; transform:translateY(-50%) scale(1);}
    100%{opacity:0; transform:translateY(-50%) scale(0.6) translateY(-10px);}
  }

  /* NAV */
  nav{ display:flex; flex-shrink:0; border-top:1px solid rgba(217,154,78,0.15); background:linear-gradient(180deg, var(--wood-mid), var(--wood-dark)); }
  nav button{ flex:1; padding:11px 4px; background:none; border:none; color:var(--ink-dim); font-family:'IM Fell English SC',serif; font-size:0.76rem; font-weight:600; letter-spacing:0.4px; border-bottom:3px solid transparent; }
  nav button.active{ color:var(--candle-bright); border-bottom-color:var(--candle); text-shadow:0 0 8px rgba(217,154,78,0.4); }

  /* PANEL */
  #panel{
    flex-shrink:0; height:40vh; max-height:340px; overflow-y:auto; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 26px),
      linear-gradient(180deg, var(--wood-mid), var(--wood-dark));
    border-top:1px solid rgba(0,0,0,.4);
  }

  /* CARDS — parchment/etched */
  .card{
    --r:var(--common); --r2:var(--common2);
    position:relative; overflow:hidden;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(0,0,0,.12), transparent 55%),
      radial-gradient(ellipse at 85% 80%, rgba(0,0,0,.1), transparent 55%),
      linear-gradient(160deg, color-mix(in srgb, var(--r) 14%, var(--parchment)), var(--parchment-dark));
    border:1.5px solid color-mix(in srgb, var(--r) 60%, #241a12 40%);
    border-radius:3px; padding:12px 13px; margin-bottom:10px;
    font-family:'IM Fell English',serif; color:var(--ink);
    box-shadow:0 0 0 1px rgba(0,0,0,0.25) inset, 0 3px 10px rgba(0,0,0,0.45);
    transition:opacity .15s, transform .1s, box-shadow .3s;
  }
  .card.disabled{ opacity:.6; }
  .card:active{ transform:scale(0.985); }
  @media (hover:hover){ .card:not(.disabled):hover{ transform:translateY(-2px); box-shadow:0 5px 14px rgba(0,0,0,0.5); } }

  .card.rarity-common{ --r:var(--common); --r2:var(--common2); }
  .card.rarity-rare{ --r:var(--rare); --r2:var(--rare2); }
  .card.rarity-epic{ --r:var(--epic); --r2:var(--epic2); }
  .card.rarity-legendary{ --r:var(--legendary); --r2:var(--legendary2); animation:legendaryPulse 2.6s ease-in-out infinite; }
  @keyframes legendaryPulse{
    0%,100%{ box-shadow:0 0 10px 1px color-mix(in srgb, var(--legendary) 40%, transparent), 0 3px 10px rgba(0,0,0,.45); }
    50%{ box-shadow:0 0 18px 4px color-mix(in srgb, var(--legendary) 55%, transparent), 0 3px 10px rgba(0,0,0,.45); }
  }

  /* wax seal instead of pill */
  .wax-seal{
    position:absolute; top:8px; right:8px; width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--r) 70%, white 10%), color-mix(in srgb, var(--r) 70%, black 25%));
    box-shadow:0 2px 3px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center;
    font-size:0.85rem; color:rgba(255,255,255,.85); z-index:2;
  }
  .wax-seal::after{
    content:""; position:absolute; inset:3px; border-radius:50%;
    border:1px dashed rgba(255,255,255,.25);
  }

  .card-top{ display:flex; align-items:center; gap:10px; margin-bottom:7px; position:relative; z-index:1; padding-right:38px; }
  .card-icon{
    width:42px; height:42px; border-radius:4px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:1.35rem;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--r) 45%, white 10%), color-mix(in srgb, var(--r) 45%, black 20%));
    box-shadow:0 0 8px color-mix(in srgb, var(--r) 45%, transparent), inset 0 0 0 1px rgba(0,0,0,.3);
  }
  .card-head{ min-width:0; flex:1; }
  .card-name{ font-family:'Pirata One',Georgia,serif; font-weight:400; font-size:1rem; color:var(--ink); letter-spacing:.2px; }
  .card-rarity-label{ margin-top:2px; font-size:0.66rem; font-weight:700; letter-spacing:.4px; color:color-mix(in srgb, var(--r) 65%, black 35%); text-transform:uppercase; }
  .card-flavor{ font-style:italic; font-size:0.74rem; color:color-mix(in srgb, var(--ink) 70%, transparent); margin-bottom:6px; position:relative; z-index:1; }
  .card-desc{ font-size:0.8rem; color:var(--ink); opacity:.92; margin-bottom:8px; position:relative; z-index:1; }
  .card-footer{ display:flex; align-items:center; justify-content:space-between; gap:8px; position:relative; z-index:1; }
  .card-level{ font-size:0.72rem; color:color-mix(in srgb, var(--ink) 75%, transparent); display:flex; align-items:center; gap:6px; }
  .level-pips{ color:color-mix(in srgb, var(--r) 70%, black 20%); letter-spacing:1px; font-size:0.7rem; }
  .card-buy{
    flex-shrink:0; border:none; border-radius:4px; padding:9px 14px; font-weight:700; font-size:0.82rem;
    color:#fbf1de; background:linear-gradient(180deg, color-mix(in srgb, var(--r) 55%, black 5%), color-mix(in srgb, var(--r) 55%, black 30%));
    font-family:'IM Fell English',serif;
    cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,0.4);
  }
  .card-buy:focus-visible{ outline:2px solid var(--candle-bright); outline-offset:2px; }
  .card.disabled .card-buy{ background:#4a3d2c; color:#8c7a5e; box-shadow:none; }
  .card-buy:disabled{ background:#4a3d2c; color:#8c7a5e; box-shadow:none; cursor:default; opacity:.85; }

  .loc-progress{ height:7px; background:rgba(0,0,0,0.25); border-radius:3px; overflow:hidden; margin:6px 0 2px; }
  .loc-progress-fill{ height:100%; background:linear-gradient(90deg,var(--r),var(--r2)); box-shadow:0 0 8px color-mix(in srgb, var(--r2) 60%, transparent); transition:width .3s ease; }

  .miner-sprite{ width:20px; height:20px; image-rendering:pixelated; vertical-align:middle; }

  .card-rolls{ font-size:0.68rem; color:color-mix(in srgb, var(--ink) 65%, transparent); margin-top:2px; position:relative; z-index:1; }
  .card.locked .card-icon{ filter:grayscale(1) brightness(.75); }
  .card.locked .card-name{ color:color-mix(in srgb, var(--ink) 55%, transparent); font-style:italic; }

  /* GACHA MODAL */
  /* Anchored to the side like the chest, not a full-screen modal — the
     wrapper stays pointer-events:none so clicks everywhere else (including
     most of #rock-wrap) pass through; only .gacha-card itself catches them. */
  #gacha-overlay{
    position:fixed; right:min(1.5vw,6px); top:50%; transform:translateY(-50%);
    z-index:70; pointer-events:none; opacity:0; transition:opacity .25s ease;
  }
  #gacha-overlay.show{ opacity:1; }
  .gacha-card{
    width:min(74vw, 200px); border-radius:6px; padding:16px 14px;
    background:linear-gradient(160deg, var(--wood-light), var(--wood-dark));
    border:2px solid #000a; box-shadow:0 10px 40px rgba(0,0,0,.7), inset 0 0 0 1px rgba(217,154,78,.15);
    text-align:center; pointer-events:none;
  }
  #gacha-overlay.show .gacha-card{ pointer-events:auto; }
  .gacha-title{ font-family:'Pirata One',Georgia,serif; color:var(--candle-bright); font-size:1rem; margin-bottom:12px; text-shadow:0 0 10px rgba(217,154,78,.4); }
  .reel-viewport{ position:relative; width:160px; height:52px; margin:0 auto 14px; overflow:hidden; border-radius:4px; background:rgba(0,0,0,.4); box-shadow:inset 0 0 12px rgba(0,0,0,.7), 0 0 0 1px rgba(217,154,78,.25); }
  .reel-track{ position:absolute; top:0; left:0; height:100%; display:flex; will-change:transform; }
  .reel-item{ position:relative; width:46px; height:46px; margin:3px; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1.3rem; overflow:hidden;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--r) 55%, white 10%), color-mix(in srgb, var(--r) 55%, black 20%));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);
  }
  .reel-figure{ position:absolute; inset:0; width:88%; height:88%; margin:auto; object-fit:contain; }
  .reel-marker{ position:absolute; left:50%; top:-4px; bottom:-4px; width:2px; transform:translateX(-1px); background:var(--blood-bright); box-shadow:0 0 8px var(--blood-bright); }
  .reel-marker::before, .reel-marker::after{ content:""; position:absolute; left:50%; width:0; height:0; transform:translateX(-50%); border:6px solid transparent; }
  .reel-marker::before{ top:-6px; border-top-color:var(--blood-bright); }
  .reel-marker::after{ bottom:-6px; border-bottom-color:var(--blood-bright); }

  .gacha-result{ min-height:110px; }
  .gacha-result.hidden{ display:none; }
  .result-seal{
    width:56px; height:56px; border-radius:50%; margin:0 auto 8px;
    display:flex; align-items:center; justify-content:center; font-size:1.6rem;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--r) 60%, white 15%), color-mix(in srgb, var(--r) 60%, black 20%));
    box-shadow:0 0 22px color-mix(in srgb, var(--r) 55%, transparent), inset 0 0 0 2px rgba(0,0,0,.35);
    animation:resultPop .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes resultPop{ 0%{ transform:scale(0.3); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  .result-name{ font-family:'Pirata One',Georgia,serif; color:var(--parchment); font-size:1.15rem; }
  .result-rarity{ font-size:0.72rem; letter-spacing:.5px; text-transform:uppercase; margin-top:2px; color:color-mix(in srgb, var(--r) 70%, white 20%); }
  .result-stat{ margin-top:8px; font-size:0.85rem; color:var(--candle-bright); }
  .result-roll{ font-size:0.72rem; color:var(--ink-dim); margin-top:2px; }
  .gacha-close{
    margin-top:16px; border:none; border-radius:4px; padding:10px 22px; font-weight:700; font-size:0.85rem;
    color:#fbf1de; background:linear-gradient(180deg, var(--blood-bright), var(--blood)); font-family:'IM Fell English',serif;
    cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,0.4);
  }
  .gacha-close.hidden{ display:none; }

  #legendary-flash{ position:fixed; inset:0; z-index:69; background:#fff; opacity:0; pointer-events:none; }
  #legendary-flash.flash{ animation:legendFlash 1.1s ease-out; }
  @keyframes legendFlash{ 0%{opacity:0;} 8%{opacity:.95;} 30%{opacity:.15;} 45%{opacity:.5;} 60%{opacity:.05;} 100%{opacity:0;} }
  #gacha-overlay.legendary .gacha-card{ box-shadow:0 0 60px rgba(232,189,104,.5), 0 10px 40px rgba(0,0,0,.7); }
  #gacha-overlay.legendary .result-name{ font-size:1.4rem; text-shadow:0 0 14px rgba(232,189,104,.6); }

  @media (prefers-reduced-motion: reduce){
    #portal.active{ animation:none; opacity:.5; transition:opacity .25s ease; }
    #rock-wrap.flipping #rock{ animation:none; }
    .card.rarity-legendary{ animation:none; }
    .ambient-particle{ display:none; }
    #rock-glow{ animation:none; }
    .crystal{ animation:none; }
    #pickaxe.swing{ animation:none; }
    #chest{ animation:none; }
    #legendary-flash.flash{ animation:none; }
  }
</style>
</head>

  function b64ToArrayBuffer(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  // ---------- PERSISTENCE ----------
  function load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(raw) state = Object.assign(state, JSON.parse(raw));
    }catch(e){}
    if(!Array.isArray(state.gachaMiners)) state.gachaMiners=[];
    if(!LOCATIONS[state.currentLocation] || state.totalEarned < LOCATIONS[state.currentLocation].unlockAt){
      state.currentLocation = 0;
    }
  }
  // localStorage stays the source of truth for the instant, synchronous boot
  // read above (works identically with no SDK at all). Once Yandex's player
  // handle shows up (platform requirement 1.9) we additionally push every
  // save to the cloud, and reconcile once on startup in favor of whichever
  // save has progressed further (totalEarned only ever increases, so it's a
  // safe monotonic comparison — no dependence on possibly-skewed clocks).
  function save(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
    const player = window.__yandexPlayer;
    if(player){
      try{ player.setData({ save: JSON.stringify(state) }, true).catch(()=>{}); }catch(e){}
    }
  }
  function syncCloudSave(){
    const player = window.__yandexPlayer;
    if(!player) return;
    player.getData(["save"]).then(function(data){
      const raw = data && data.save;
      if(!raw){ save(); return; }
      try{
        const cloudState = JSON.parse(raw);
        if(cloudState && typeof cloudState.totalEarned === "number" && cloudState.totalEarned > state.totalEarned){
          state = Object.assign(state, cloudState);
          if(!Array.isArray(state.gachaMiners)) state.gachaMiners = [];
          if(!LOCATIONS[state.currentLocation] || state.totalEarned < LOCATIONS[state.currentLocation].unlockAt){
            state.currentLocation = 0;
          }
          applyLocationVisual();
          updateHeader();
          renderPanel();
        }
      }catch(e){}
    }).catch(()=>{});
  }
  window.addEventListener("yandex-player-ready", syncCloudSave);

  // ---------- ECONOMY MATH (unchanged formulas from v2) ----------
  function costFor(base, mult, level){ return Math.ceil(base * Math.pow(mult, level)); }
  function unlockedCount(){ return LOCATIONS.filter(l=> state.totalEarned >= l.unlockAt).length; }
  function locationBonusMult(){ return 1 + 0.15*(unlockedCount()-1); }
  // Rewarded-ad bonus (platform requirement 4.5): a short, explicitly
  // consented-to x2 window, not a passive multiplier — expires on its own.
  function rewardMult(){ return (state.rewardBoostUntil && Date.now() < state.rewardBoostUntil) ? 2 : 1; }
  function clickPower(){ return (1 + state.clickLevel*clickUpgrade.baseValue) * locationBonusMult() * rewardMult(); }
  function perSecond(){
    let total=0;
    state.gachaMiners.forEach(m=> total += m.rate);
    return total * locationBonusMult() * rewardMult();
  }

  function fmt(n){
    n = Math.floor(n);
    if(n < 1000) return String(n);
    if(n < 1e6) return (n/1e3).toFixed(2).replace(/\.00$/,'') + "K";
    if(n < 1e9) return (n/1e6).toFixed(2).replace(/\.00$/,'') + "M";
    return (n/1e9).toFixed(2).replace(/\.00$/,'') + "B";
  }
  function fmtPrecise(n){
    if(n < 1000){ const r = Math.round(n*10)/10; return (r%1===0) ? String(r) : r.toFixed(1); }
    return fmt(n);
  }
  function pips(level){
    const filled = Math.min(level,5);
    let s = "●".repeat(filled) + "○".repeat(Math.max(0,5-filled));
    if(level>5) s += " +"+(level-5);
    return s;
  }

  // ---------- AUDIO ----------
  let audioCtx = null;
  const sampleCache = {};
  let reverbNode = null;
  function getCtx(){
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function buildReverb(ctx){
    const len = ctx.sampleRate * 1.1;
    const impulse = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for(let i=0;i<len;i++){
        data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.6);
      }
    }
    const conv = ctx.createConvolver();
    conv.buffer = impulse;
    const wet = ctx.createGain();
    wet.gain.value = 0.22;
    conv.connect(wet).connect(ctx.destination);
    return { input: conv, wet };
  }
  function loadSample(name, b64){
    sampleCache[name] = getCtx().decodeAudioData(b64ToArrayBuffer(b64)).catch(()=> null);
  }
  function preloadAudio(){
    Object.keys(SOUNDS).forEach(name=> loadSample(name, SOUNDS[name]));
  }
  async function playSample(name, {rate=1, gain=0.5, dry=0.75}={}){
    if(state.muted) return;
    const buf = await sampleCache[name];
    if(!buf) return;
    const ctx = getCtx();
    if(!reverbNode) reverbNode = buildReverb(ctx);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = rate * (0.96 + Math.random()*0.08);
    const g = ctx.createGain();
    g.gain.value = gain;
    src.connect(g);
    g.connect(ctx.destination);
    const wetGain = ctx.createGain();
    wetGain.gain.value = gain*(1-dry);
    g.connect(wetGain).connect(reverbNode.input);
    src.start();
  }
  function tone(freq, start, dur, type, peak){
    if(state.muted) return;
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const lp = ctx.createBiquadFilter();
    lp.type="lowpass"; lp.frequency.value = 1600;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime+start);
    gain.gain.setValueAtTime(0, ctx.currentTime+start);
    gain.gain.linearRampToValueAtTime(peak, ctx.currentTime+start+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
    osc.connect(lp).connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime+start);
    osc.stop(ctx.currentTime+start+dur+0.03);
  }
  function playMiningHit(){ playSample("hit"+Math.floor(Math.random()*5), {gain:0.55}); }
  function playChestDrop(){ playSample("chestDrop", {gain:0.5}); }
  function playChestOpen(){ playSample(Math.random()<0.5?"chestOpen0":"chestOpen1", {gain:0.55}); }
  function playChestClose(){ playSample("chestClose", {gain:0.4}); }
  function playTick(){ playSample("tick"+Math.floor(Math.random()*3), {gain:0.35, rate:1+Math.random()*0.15}); }
  function playConfirm(){ playSample("confirm", {gain:0.5}); }
  function playLegendaryBell(){ playSample(Math.random()<0.5?"bell0":"bell1", {gain:0.6, dry:0.5}); }
  function playBuy(rarity){
    if(rarity==="epic"){ tone(494,0,0.1,'triangle',0.06); tone(659,0.1,0.16,'triangle',0.07); }
    else if(rarity==="legendary"){ playLegendaryBell(); }
    else { tone(420,0,0.1,'triangle',0.05); }
  }
  function playTravel(){
    if(state.muted) return;
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(560, ctx.currentTime+0.55);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.05, ctx.currentTime+0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.6);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.65);
  }
  function playUnlock(){ playConfirm(); }
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden){ graStop(); } else { graStart(); }
    if(!audioCtx) return;
    if(document.hidden) audioCtx.suspend(); else audioCtx.resume();
  });

  // ---------- YANDEX PLATFORM COMPLIANCE ----------
  // Requirement 1.6: the browser's own right-click / long-press context menu
  // has no use in a single-screen clicker and would sit on top of the game's
  // own UI, so it's suppressed across the whole page (the entire page is the
  // "game area" here — there's no separate chrome to exempt).
  document.addEventListener("contextmenu", (e)=> e.preventDefault());

  // Requirement 1.19.2 (Game Ready API): pair GameplayAPI.start()/stop() with
  // whatever actually pauses/resumes play — tab visibility and ad playback.
  // Both are no-ops with no SDK present (window.ysdk undefined off-platform).
  function graStart(){
    const ysdk = window.ysdk;
    if(ysdk && ysdk.features && ysdk.features.GameplayAPI) ysdk.features.GameplayAPI.start();
  }
  function graStop(){
    const ysdk = window.ysdk;
    if(ysdk && ysdk.features && ysdk.features.GameplayAPI) ysdk.features.GameplayAPI.stop();
  }

  // Requirement 4.4/4.7: interstitials only at a genuine gameplay pause (a
  // location finishing its travel transition — never mid-click), throttled so
  // they can't stack up back-to-back, and always pausing audio while shown.
  let lastInterstitialAt = 0;
  const INTERSTITIAL_MIN_GAP_MS = 3*60*1000;
  function maybeShowInterstitial(){
    const ysdk = window.ysdk;
    if(!ysdk || !ysdk.adv) return;
    const now = Date.now();
    if(now - lastInterstitialAt < INTERSTITIAL_MIN_GAP_MS) return;
    lastInterstitialAt = now;
    ysdk.adv.showFullscreenAdv({
      callbacks:{
        onOpen: ()=>{ if(audioCtx) audioCtx.suspend(); graStop(); },
        onClose: ()=>{ if(audioCtx && !document.hidden) audioCtx.resume(); graStart(); },
        onError: ()=>{ if(audioCtx && !document.hidden) audioCtx.resume(); graStart(); },
      }
    });
  }

  // Requirement 4.5: rewarded video always behind an explicit confirm — the
  // SDK call only fires after the player agrees, never automatically.
  function applyRewardBonus(){
    state.rewardBoostUntil = Date.now() + 60000;
    updateHeader();
    save();
    showToast("Бонус активен: x2 добыча на 60 секунд ⚡");
  }
  function showRewardedBonus(){
    const ysdk = window.ysdk;
    if(!ysdk || !ysdk.adv){
      showToast("Реклама доступна только в Яндекс Играх");
      return;
    }
    if(!window.confirm("Посмотреть короткую рекламу и получить x2 к добыче на 60 секунд?")) return;
    ysdk.adv.showRewardedVideo({
      callbacks:{
        onOpen: ()=>{ if(audioCtx) audioCtx.suspend(); graStop(); },
        onRewarded: ()=> applyRewardBonus(),
        onClose: ()=>{ if(audioCtx && !document.hidden) audioCtx.resume(); graStart(); },
        onError: ()=>{ if(audioCtx && !document.hidden) audioCtx.resume(); graStart(); },
      }
    });
  }

  // ---------- AMBIENT MUSIC ----------
  // A generative music-box melody, not a static drone: a barely-audible low
  // pad for space, plus single bell-like notes from a minor-pentatonic scale
  // (any random order sounds intentional on a pentatonic scale, never a wrong
  // note) dropped in one at a time on a slow, irregular clock — that's what
  // actually reads as "music" instead of a hum. Routed through the same
  // audioCtx/reverb as the sound effects, well under their volume so
  // clicks/chest/gacha stay clearly on top. Started lazily on the player's
  // first interaction (never before, per autoplay policy) and muted by the
  // same state.muted toggle as everything else; the visibilitychange handler
  // above already suspends/resumes the whole audioCtx when the tab is
  // hidden, which pauses every note/timer for free (a suspended context
  // stops advancing currentTime, and setTimeout keeps firing in real time
  // but playMelodyNote() just schedules against a currentTime that isn't
  // moving, so nothing audible happens until resume).
  const MUSIC_SCALE = [110.00, 130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63, 392.00]; // A minor pentatonic, 2 octaves
  const MUSIC_DRONE = [55.00, 82.41]; // A1, E2 — just a soft floor under the melody
  const MUSIC_NOTE_PEAK = 0.07;
  const MUSIC_DRONE_VOLUME = 0.02;
  let musicStarted = false;
  let musicMasterGain = null;
  let musicBus = null;
  function startMusic(){
    if(musicStarted) return;
    musicStarted = true;
    const ctx = getCtx();
    if(!reverbNode) reverbNode = buildReverb(ctx);
    musicMasterGain = ctx.createGain();
    musicMasterGain.gain.value = state.muted ? 0 : 1;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 1400;
    musicMasterGain.connect(lp);
    lp.connect(ctx.destination);
    lp.connect(reverbNode.input);
    musicBus = musicMasterGain;

    MUSIC_DRONE.forEach(freq=>{
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.value = MUSIC_DRONE_VOLUME;
      osc.connect(g).connect(musicBus);
      osc.start();
    });

    scheduleNextNote();
  }
  function playMelodyNote(){
    const ctx = getCtx();
    const freq = MUSIC_SCALE[Math.floor(Math.random()*MUSIC_SCALE.length)];
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.value = freq;
    const g = ctx.createGain();
    const now = ctx.currentTime;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(MUSIC_NOTE_PEAK, now + 0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 3.4);
    osc.connect(g).connect(musicBus);
    osc.start(now);
    osc.stop(now + 3.5);
  }
  function scheduleNextNote(){
    setTimeout(()=>{
      playMelodyNote();
      if(Math.random() < 0.4) setTimeout(playMelodyNote, 650 + Math.random()*550);
      scheduleNextNote();
    }, 2000 + Math.random()*2600);
  }
  function setMusicMuted(muted){
    if(!musicMasterGain) return;
    const ctx = getCtx();
    musicMasterGain.gain.cancelScheduledValues(ctx.currentTime);
    musicMasterGain.gain.linearRampToValueAtTime(muted ? 0 : 1, ctx.currentTime + 0.5);
  }

  // ---------- PROCEDURAL TEXTURES ----------
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function makeValueNoise(rng, gridSize){
    const grid = [];
    for(let y=0;y<=gridSize;y++){ const row=[]; for(let x=0;x<=gridSize;x++) row.push(rng()); grid.push(row); }
    return function(u,v){ // u,v in [0,1)
      const gx = u*gridSize, gy = v*gridSize;
      const x0=Math.floor(gx), y0=Math.floor(gy);
      const x1=Math.min(x0+1,gridSize), y1=Math.min(y0+1,gridSize);
      const fx=gx-x0, fy=gy-y0;
      const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
      const a=grid[y0][x0], b=grid[y0][x1], c=grid[y1][x0], d=grid[y1][x1];
      return (a*(1-sx)+b*sx)*(1-sy) + (c*(1-sx)+d*sx)*sy;
    };
  }
  function hexToRgb(hex){
    const n = parseInt(hex.replace('#',''),16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  function lerpColor(c1,c2,t){ return [0,1,2].map(i=> Math.round(c1[i]+(c2[i]-c1[i])*t)); }

  const textureCache = {};
  function generateLocationTexture(loc, size){
    size = size || 220;
    const key = loc.id+"_"+size;
    if(textureCache[key]) return textureCache[key];
    const rng = mulberry32(loc.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0)*7919 + size);
    const noiseCoarse = makeValueNoise(rng, 6);
    const noiseFine = makeValueNoise(rng, 22);
    const base = hexToRgb(loc.rockBase), deep = hexToRgb(loc.rockDeep), acc = hexToRgb(loc.accent);
    const cvs = document.createElement('canvas');
    cvs.width = size; cvs.height = size;
    const ctx = cvs.getContext('2d');
    const img = ctx.createImageData(size,size);
    for(let y=0;y<size;y++){
      for(let x=0;x<size;x++){
        const u=x/size, v=y/size;
        const n1 = noiseCoarse(u,v);
        const n2 = noiseFine(u,v);
        const mix = Math.min(1, n1*0.7 + n2*0.35);
        let rgb = lerpColor(deep, base, mix);
        const speck = (n2-0.5)*26;
        rgb = rgb.map(c=> Math.max(0,Math.min(255, c+speck)));
        const idx=(y*size+x)*4;
        img.data[idx]=rgb[0]; img.data[idx+1]=rgb[1]; img.data[idx+2]=rgb[2]; img.data[idx+3]=255;
      }
    }
    ctx.putImageData(img,0,0);

    ctx.globalCompositeOperation = 'lighter';
    if(loc.id==="cave" || loc.id==="lava"){
      const veinCount = loc.id==="lava" ? 6 : 4;
      for(let i=0;i<veinCount;i++){
        ctx.beginPath();
        let x = rng()*size, y = rng()*size;
        ctx.moveTo(x,y);
        for(let s=0;s<5;s++){
          x += (rng()-0.5)*size*0.35; y += (rng()-0.5)*size*0.35;
          ctx.lineTo(x,y);
        }
        ctx.strokeStyle = `rgba(${acc[0]},${acc[1]},${acc[2]},${loc.id==="lava"?0.5:0.28})`;
        ctx.lineWidth = loc.id==="lava" ? 2.4 : 1.6;
        ctx.shadowColor = loc.accent; ctx.shadowBlur = loc.id==="lava"?8:5;
        ctx.stroke();
      }
    } else if(loc.id==="gold"){
      for(let i=0;i<140;i++){
        const x=rng()*size, y=rng()*size, r=rng()*1.4+0.3;
        ctx.beginPath(); ctx.arc(x,y,r,0,7);
        ctx.fillStyle = `rgba(${acc[0]},${acc[1]},${acc[2]},${0.25+rng()*0.35})`;
        ctx.fill();
      }
    } else if(loc.id==="ice"){
      for(let i=0;i<7;i++){
        ctx.beginPath();
        let x=rng()*size, y=rng()*size;
        ctx.moveTo(x,y);
        for(let s=0;s<4;s++){ x+=(rng()-0.5)*size*0.3; y+=(rng()-0.5)*size*0.3; ctx.lineTo(x,y); }
        ctx.strokeStyle = `rgba(${acc[0]},${acc[1]},${acc[2]},0.3)`;
        ctx.lineWidth=1; ctx.stroke();
      }
    } else if(loc.id==="space"){
      for(let i=0;i<90;i++){
        const x=rng()*size, y=rng()*size, r=rng()*1.1+0.2;
        ctx.beginPath(); ctx.arc(x,y,r,0,7);
        ctx.fillStyle = `rgba(255,255,255,${0.15+rng()*0.5})`;
        ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    const url = cvs.toDataURL('image/png');
    textureCache[key] = url;
    return url;
  }

  // ---------- SCENE ART (full-scene background, hand-authored shapes — not noise) ----------
  // Each location gets a recognizable illustrated scene (crystals, gold veins,
  // icicles, lava cracks, an asteroid+stars) built from small vector-shape
  // helpers below, placed with a seeded RNG for organic-but-deterministic
  // scatter. This is deliberately separate from generateLocationTexture()
  // above, which still supplies the ore's own small-scale rock-grain fill.
  function rr(rng, min, max){ return min + rng()*(max-min); }

  function svgCrystal(cx, cy, s, rot, light, dark, glow){
    return `<g transform="rotate(${rot.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})">
      <ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${(s*1.5).toFixed(1)}" ry="${(s*1.2).toFixed(1)}" fill="${glow}" opacity="0.32" filter="url(#artGlow)"/>
      <polygon points="${cx},${(cy-s).toFixed(1)} ${(cx+s*0.5).toFixed(1)},${(cy-s*0.15).toFixed(1)} ${(cx+s*0.32).toFixed(1)},${(cy+s*0.75).toFixed(1)} ${(cx-s*0.32).toFixed(1)},${(cy+s*0.75).toFixed(1)} ${(cx-s*0.5).toFixed(1)},${(cy-s*0.15).toFixed(1)}"
        fill="${light}" stroke="#160e1c" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="${cx},${(cy-s).toFixed(1)} ${(cx+s*0.5).toFixed(1)},${(cy-s*0.15).toFixed(1)} ${cx},${(cy+s*0.1).toFixed(1)}" fill="${dark}" opacity="0.55"/>
      <polygon points="${cx},${(cy-s).toFixed(1)} ${(cx-s*0.5).toFixed(1)},${(cy-s*0.15).toFixed(1)} ${cx},${(cy+s*0.1).toFixed(1)}" fill="#fff" opacity="0.18"/>
    </g>`;
  }

  function svgVein(rng, x0, y0, angle, len, segs, color, nuggetColor){
    let x=x0, y=y0;
    const pts=[[x,y]];
    for(let i=0;i<segs;i++){
      const a = angle + rr(rng,-0.55,0.55);
      x += Math.cos(a)*(len/segs); y += Math.sin(a)*(len/segs);
      pts.push([x,y]);
    }
    const d = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    let nuggets='';
    pts.forEach((p,i)=>{
      if(i>0 && i%2===0){
        const nr = rr(rng,3,6.5);
        nuggets += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${nr.toFixed(1)}" fill="${nuggetColor}" stroke="#5c3d10" stroke-width="1"/>
          <circle cx="${(p[0]-nr*0.3).toFixed(1)}" cy="${(p[1]-nr*0.3).toFixed(1)}" r="${(nr*0.35).toFixed(1)}" fill="#fff5d6" opacity="0.75"/>`;
      }
    });
    return `<path d="${d}" stroke="${color}" stroke-width="3.2" fill="none" stroke-linecap="round" filter="url(#artGlow)" opacity="0.9"/>${nuggets}`;
  }

  function svgIcicle(x, edgeY, len, w, down){
    const tipY = down ? edgeY+len : edgeY-len;
    const midY = down ? edgeY+len*0.42 : edgeY-len*0.42;
    return `<path d="M${(x-w).toFixed(1)},${edgeY} Q${x.toFixed(1)},${midY.toFixed(1)} ${x.toFixed(1)},${tipY.toFixed(1)} Q${x.toFixed(1)},${midY.toFixed(1)} ${(x+w).toFixed(1)},${edgeY} Z"
      fill="url(#iceGrad)" stroke="#0e2830" stroke-width="1.2"/>`;
  }

  function svgCrack(rng, x0, y0, segs, segLen, color, thick){
    let x=x0, y=y0, angle = rr(rng,0,Math.PI*2);
    let d = `M${x.toFixed(1)},${y.toFixed(1)}`;
    for(let i=0;i<segs;i++){
      angle += rr(rng,-0.85,0.85);
      x += Math.cos(angle)*segLen; y += Math.sin(angle)*segLen;
      d += ` L${x.toFixed(1)},${y.toFixed(1)}`;
    }
    return `<path d="${d}" stroke="${color}" stroke-width="${thick}" fill="none" stroke-linecap="round" filter="url(#artGlow)" opacity="0.92"/>`;
  }

  function svgStarField(rng, w, h, count){
    let out='';
    for(let i=0;i<count;i++){
      const x=rr(rng,0,w), y=rr(rng,0,h*0.75), r=rr(rng,0.6,2.2), op=rr(rng,0.35,0.95);
      out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#fff" opacity="${op.toFixed(2)}"/>`;
    }
    for(let i=0;i<6;i++){
      const x=rr(rng,0,w), y=rr(rng,0,h*0.6), r=rr(rng,2.2,3.6);
      out += `<path d="M${x.toFixed(1)},${(y-r*2.2).toFixed(1)} L${(x+r*0.5).toFixed(1)},${(y-r*0.5).toFixed(1)} L${(x+r*2.2).toFixed(1)},${y.toFixed(1)} L${(x+r*0.5).toFixed(1)},${(y+r*0.5).toFixed(1)} L${x.toFixed(1)},${(y+r*2.2).toFixed(1)} L${(x-r*0.5).toFixed(1)},${(y+r*0.5).toFixed(1)} L${(x-r*2.2).toFixed(1)},${y.toFixed(1)} L${(x-r*0.5).toFixed(1)},${(y-r*0.5).toFixed(1)} Z" fill="#fff" opacity="0.9"/>`;
    }
    return out;
  }

  function svgAsteroid(rng, cx, cy, r){
    const n=11, pts=[];
    for(let i=0;i<n;i++){
      const a = (i/n)*Math.PI*2;
      const rad = r*rr(rng,0.72,1.08);
      pts.push([cx+Math.cos(a)*rad, cy+Math.sin(a)*rad]);
    }
    const poly = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    let craters='';
    for(let i=0;i<5;i++){
      const a=rr(rng,0,Math.PI*2), dist=rr(rng,0,r*0.55), cr=r*rr(rng,0.08,0.16);
      const px=cx+Math.cos(a)*dist, py=cy+Math.sin(a)*dist;
      craters += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${cr.toFixed(1)}" fill="#100a1e" opacity="0.55"/>`;
    }
    return `<polygon points="${poly}" fill="url(#asteroidGrad)" stroke="#0a0714" stroke-width="2.5" stroke-linejoin="round"/>${craters}`;
  }

  const artCache = {};
  function generateLocationArt(loc){
    if(artCache[loc.id]) return artCache[loc.id];
    const rng = mulberry32(loc.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0)*104729 + 17);
    const W=400, H=700;
    const deep = loc.rockDeep, base = loc.rockBase, acc = loc.accent, acc2 = loc.accent2;
    let scene = '';
    const defs = `<defs>
      <filter id="artGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
      <radialGradient id="bgGrad" cx="50%" cy="20%" r="90%">
        <stop offset="0%" stop-color="${base}"/><stop offset="100%" stop-color="${deep}"/>
      </radialGradient>
      <linearGradient id="iceGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#eaf7fb"/><stop offset="100%" stop-color="${acc}"/>
      </linearGradient>
      <radialGradient id="asteroidGrad" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="${acc2}"/><stop offset="100%" stop-color="${deep}"/>
      </radialGradient>
      <radialGradient id="lavaPool" cx="50%" cy="100%" r="70%">
        <stop offset="0%" stop-color="${acc2}"/><stop offset="60%" stop-color="${acc}"/><stop offset="100%" stop-color="transparent"/>
      </radialGradient>
    </defs>`;
    let body = `<rect width="${W}" height="${H}" fill="url(#bgGrad)"/>`;

    if(loc.id==="cave"){
      body += `<path d="M0,0 L${W*0.22},0 Q${W*0.05},${H*0.4} ${W*0.12},${H} L0,${H} Z" fill="${deep}" opacity="0.85"/>`;
      body += `<path d="M${W},0 L${W*0.78},0 Q${W*0.95},${H*0.4} ${W*0.88},${H} L${W},${H} Z" fill="${deep}" opacity="0.85"/>`;
      const spots = [[80,150],[70,420],[320,190],[330,460],[190,90],[150,600],[260,610],[60,270]];
      spots.forEach((p,i)=>{
        const s = rr(rng,20,40);
        body += svgCrystal(p[0], p[1], s, rr(rng,-18,18), acc2, acc, acc);
      });
      for(let i=0;i<16;i++){
        body += `<circle cx="${rr(rng,0,W).toFixed(1)}" cy="${rr(rng,0,H).toFixed(1)}" r="${rr(rng,1,2.4).toFixed(1)}" fill="${acc2}" opacity="${rr(rng,0.3,0.8).toFixed(2)}"/>`;
      }
    } else if(loc.id==="gold"){
      for(let i=0;i<5;i++){
        body += svgVein(rng, rr(rng,20,W-20), rr(rng,0,H*0.3), rr(rng,1.0,2.1), rr(rng,220,340), 6, acc, acc2);
      }
      for(let i=0;i<6;i++){
        const x=rr(rng,30,W-30), y=rr(rng,H*0.75,H-30), r=rr(rng,5,10);
        body += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${acc}" stroke="#5c3d10" stroke-width="1.4"/>
          <circle cx="${(x-r*0.3).toFixed(1)}" cy="${(y-r*0.3).toFixed(1)}" r="${(r*0.35).toFixed(1)}" fill="#fff5d6" opacity="0.8"/>`;
      }
    } else if(loc.id==="ice"){
      const topXs=[40,95,150,210,270,330,375];
      topXs.forEach(x=> body += svgIcicle(x+rr(rng,-8,8), 0, rr(rng,70,170), rr(rng,10,20), true));
      const botXs=[60,130,200,260,330];
      botXs.forEach(x=> body += svgIcicle(x+rr(rng,-8,8), H, rr(rng,60,140), rr(rng,12,22), false));
      for(let i=0;i<5;i++){
        body += svgCrack(rng, rr(rng,40,W-40), rr(rng,H*0.25,H*0.75), 4, 26, acc2, 1.6);
      }
      for(let i=0;i<20;i++){
        body += `<circle cx="${rr(rng,0,W).toFixed(1)}" cy="${rr(rng,0,H).toFixed(1)}" r="${rr(rng,0.8,1.8).toFixed(1)}" fill="#fff" opacity="${rr(rng,0.3,0.7).toFixed(2)}"/>`;
      }
    } else if(loc.id==="lava"){
      body += `<ellipse cx="${W*0.5}" cy="${H}" rx="${W*0.7}" ry="${H*0.28}" fill="url(#lavaPool)" opacity="0.85"/>`;
      for(let i=0;i<7;i++){
        body += svgCrack(rng, rr(rng,20,W-20), rr(rng,0,H*0.7), 5, 30, acc, 3.2);
      }
      for(let i=0;i<10;i++){
        const x=rr(rng,0,W), y=rr(rng,H*0.55,H);
        body += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr(rng,1.4,3).toFixed(1)}" fill="${acc2}" opacity="${rr(rng,0.5,0.95).toFixed(2)}" filter="url(#artGlow)"/>`;
      }
    } else if(loc.id==="space"){
      body += svgStarField(rng, W, H, 70);
      body += svgAsteroid(rng, W*0.68, H*0.62, 105);
      body += svgAsteroid(rng, W*0.14, H*0.22, 40);
      body += `<circle cx="${W*0.68}" cy="${H*0.62}" r="130" fill="${acc}" opacity="0.12" filter="url(#artGlow)"/>`;
    }

    scene = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">${defs}${body}</svg>`;
    artCache[loc.id] = scene;
    return scene;
  }

  function svgToDataUrl(svgString){
    return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgString)));
  }

  // ---------- ICON ART (replaces tiny 16x16 pixel-sprite placeholders) ----------
  const PICKAXE_ICON_URL = svgToDataUrl(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

      <linearGradient id="hg1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5c4026"/><stop offset="100%" stop-color="#2c1c10"/></linearGradient>

  const gemIconCache = {};

    if(gemIconCache[loc.id]) return gemIconCache[loc.id];

      <defs><filter id="artGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter></defs>

  const minerIconCache = {};
  function minerIconUrl(rarity){
    if(minerIconCache[rarity]) return minerIconCache[rarity];
    const colors = { common:"#7fae63", rare:"#2f8fd4", epic:"#a13fd4", legendary:"#f0a92f" };

      <circle cx="20" cy="8.5" r="1.6" fill="#ffe27a"/>

      <path d="M31,7 L37,9 L33,14 Z" fill="#9aa0a8" stroke="#150e08" stroke-width="1"/>

  function accentHue(hex){
    // crude hue estimate to tint sprite chunks toward location accent
    const [r,g,b] = hexToRgb(hex||"#8b7cf0");
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    let h=0;
    if(max!==min){
      if(max===r) h=60*(((g-b)/(max-min))%6);
      else if(max===g) h=60*((b-r)/(max-min)+2);
      else h=60*((r-g)/(max-min)+4);
    }
    return Math.round(h);
  }

  function runParticle(el, x0, y0, vx, vy, life, gravity, rotSpeed){
    const start = performance.now();
    let rot = 0;
    function frame(now){
      const t = now-start;
      if(t>life){ el.remove(); return; }
      const tt = t; // ms
      const px = x0 + vx*(tt/1000);
      const py = y0 + vy*(tt/1000) + 0.5*gravity*tt*tt/1000;
      rot += rotSpeed;
      const fade = 1 - t/life;
      el.style.transform = `translate(${vx>=0?'':''}${px-x0}px, ${py-y0}px) rotate(${rot}deg)`;
      el.style.left = x0+"px"; el.style.top = y0+"px";
      el.style.opacity = Math.max(0, fade);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function burstAtViewportPoint(cx,cy,color,count){
    for(let i=0;i<count;i++){
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.style.position = "fixed";
      chip.style.left = cx+"px"; chip.style.top = cy+"px";
      chip.style.background = color;
      chip.style.zIndex = 46;
      document.body.appendChild(chip);
      const angle = Math.random()*Math.PI*2;
      const dist = 20+Math.random()*70;
      runParticle(chip, cx, cy, Math.cos(angle)*dist*2, Math.sin(angle)*dist*2-30, 650, 0.002, Math.random()*360);
    }
  }
  function celebrateBuy(cardEl, rarity){
    if(reducedMotion) return;
    if(rarity!=="epic" && rarity!=="legendary") return;
    const rect = cardEl.getBoundingClientRect();
    const color = rarity==="legendary" ? "var(--legendary2)" : "var(--epic2)";
    const count = rarity==="legendary" ? 14 : 8;
    burstAtViewportPoint(rect.left+40, rect.top+rect.height/2, color, count);
  }

  let ambientTimer = null;
  function spawnAmbient(){
    const loc = LOCATIONS[state.currentLocation];
    const p = document.createElement("div");
    p.className = "ambient-particle";
    const size = (2+Math.random()*3).toFixed(1);
    p.style.width = p.style.height = size+"px";
    p.style.left = (8+Math.random()*84)+"%";
    p.style.top = (15+Math.random()*75)+"%";
    p.style.background = loc.accent2;
    p.style.boxShadow = `0 0 ${size*2}px ${loc.accent2}`;
    const dur = (3+Math.random()*2.4);
    p.style.animationDuration = dur.toFixed(2)+"s";
    mainEl.appendChild(p);
    setTimeout(()=> p.remove(), dur*1000+200);
  }
  function startAmbient(){
    if(reducedMotion) return;
    ambientTimer = setInterval(()=>{ if(!document.hidden) spawnAmbient(); }, 750);
  }

  // ---------- ORE DAMAGE / CRACKS ----------
  let oreStage = 0;
  function advanceOreStage(){
    oreStage++;
    if(oreStage>=3){
      rockWrap.classList.add("shatter");
      setTimeout(()=> rockWrap.classList.remove("shatter"), 500);
      const loc = LOCATIONS[state.currentLocation];
      const rect = rockWrap.getBoundingClientRect();
      burstAtViewportPoint(rect.left+rect.width/2, rect.top+rect.height/2, loc.accent2, reducedMotion?4:10);
      oreStage = 0;
    }
    rockWrap.classList.remove("stage1","stage2");
    if(oreStage===1) rockWrap.classList.add("stage1");
    if(oreStage===2){ rockWrap.classList.add("stage1"); rockWrap.classList.add("stage2"); }
  }

  // ---------- PICKAXE SWING ----------
  const IMPACT_DELAY_MS = 175;
  function swingPickaxe(x,y){
    const loc = LOCATIONS[state.currentLocation];
    if(reducedMotion || !pointerFine){
      spawnSparks(x,y); spawnDust(x,y, loc.accent2); playMiningHit();
      return;
    }
    pickaxeEl.classList.remove("swing");
    void pickaxeEl.offsetWidth;
    pickaxeEl.classList.add("swing");
    setTimeout(()=>{
      spawnSparks(x,y);
      spawnDust(x,y, loc.accent2);
      playMiningHit();
    }, IMPACT_DELAY_MS);
  }

  // ---------- CHEST + GACHA ----------
  // The chest is a short automatic event that appears beside the ore, not a
  // modal the player must resolve before continuing — no backdrop, it never
  // covers #rock-wrap's own click area, and it bounces then opens itself.
  const CHEST_AUTO_OPEN_MS = 850;
  let chestPending = false;
  let chestAutoTimer = null;
  function maybeDropChest(){
    if(chestPending) return;
    if(Math.random() < CHEST_DROP_CHANCE){
      chestPending = true;
      chestEl.classList.remove("hidden","opening");
      playChestDrop();
      chestAutoTimer = setTimeout(openChestNow, CHEST_AUTO_OPEN_MS);
    }
  }
  function openChestNow(){
    if(!chestPending || chestEl.classList.contains("opening")) return;
    clearTimeout(chestAutoTimer);
    chestEl.classList.add("opening");
    playChestOpen();
    setTimeout(playChestClose, 200);
    setTimeout(()=>{
      chestEl.classList.add("hidden");
      chestEl.classList.remove("opening");
      chestPending = false;
      openGachaFlow();
    }, 500);
  }
  chestEl.addEventListener("click", (e)=>{
    e.stopPropagation();
    openChestNow();
  });

  function rollRarity(){
    const total = Object.values(GACHA_WEIGHTS).reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    for(const rarity of Object.keys(GACHA_WEIGHTS)){
      const w = GACHA_WEIGHTS[rarity];
      if(r<w) return rarity;
      r -= w;
    }
    return "common";
  }

  const gachaOverlay = document.getElementById("gacha-overlay");
  const reelTrack = document.getElementById("reel-track");
  const gachaResultEl = document.getElementById("gacha-result");
  const gachaCloseBtn = document.getElementById("gacha-close");
  const legendaryFlashEl = document.getElementById("legendary-flash");
  const REEL_ITEM_W = 52;
  const REEL_VIEWPORT_W = 160;
  const REEL_LEN = 26;

  function openGachaFlow(){
    const rarity = rollRarity();
    const defIndex = autoDefs.findIndex(d=>d.rarity===rarity);
    const def = autoDefs[defIndex];
    const roll = 1 - STAT_ROLL_RANGE + Math.random()*STAT_ROLL_RANGE*2;
    const rolledRate = def.rate * roll;
    state.gachaMiners.push({ defIndex, rate: rolledRate });
    save();

    gachaResultEl.classList.add("hidden");
    gachaCloseBtn.classList.add("hidden");
    gachaOverlay.classList.toggle("legendary", rarity==="legendary");
    gachaOverlay.classList.add("show");

    reelTrack.innerHTML = "";
    reelTrack.style.transform = "translateX(0px)";
    const strip = [];
    for(let i=0;i<REEL_LEN-1;i++){
      const rr = Object.keys(GACHA_WEIGHTS)[Math.floor(Math.random()*4)];
      strip.push(autoDefs.findIndex(d=>d.rarity===rr));
    }
    strip.push(defIndex);
    strip.forEach(idx=>{
      const d = autoDefs[idx];
      const item = document.createElement("div");
      item.className = "reel-item";
      item.style.setProperty("--r", "var(--"+d.rarity+")");
      const fig = document.createElement("img");
      fig.className = "reel-figure";
      withImgFallback(fig);
      fig.src = minerIconUrl(d.rarity);
      item.appendChild(fig);
      reelTrack.appendChild(item);
    });

    const centerOffset = REEL_VIEWPORT_W/2 - REEL_ITEM_W/2;
    const finalOffset = (REEL_LEN-1)*REEL_ITEM_W - centerOffset;
    const duration = rarity==="legendary" ? 4200 : 2300;
    const power = rarity==="legendary" ? 6 : 4;
    const start = performance.now();
    let lastIdx = -1;
    function frame(now){
      const t = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-t, power);
      const offset = eased*finalOffset;
      reelTrack.style.transform = `translateX(${-offset}px)`;
      const idx = Math.floor(offset/REEL_ITEM_W);
      if(idx !== lastIdx){ lastIdx = idx; playTick(); }
      if(t<1){ requestAnimationFrame(frame); }
      else { finishGachaReveal(def, rarity, rolledRate, roll); }
    }
    requestAnimationFrame(frame);
  }

  function finishGachaReveal(def, rarity, rolledRate, roll){
    const r = RARITY[rarity];
    if(rarity==="legendary" && !reducedMotion){
      legendaryFlashEl.classList.remove("flash");
      void legendaryFlashEl.offsetWidth;
      legendaryFlashEl.classList.add("flash");
    }
    playConfirm();
    if(rarity==="legendary") playLegendaryBell();
    document.getElementById("result-seal").style.setProperty("--r", "var(--"+rarity+")");
    document.getElementById("result-seal").textContent = def.icon;
    document.getElementById("result-name").textContent = def.name;
    document.getElementById("result-rarity").textContent = r.label;
    document.getElementById("result-rarity").style.color = "var(--"+rarity+")";
    document.getElementById("result-stat").textContent = `+${fmtPrecise(rolledRate)} 💎/сек`;
    document.getElementById("result-roll").textContent = `Ролл: ${Math.round(roll*100)}% от базового`;
    gachaResultEl.classList.remove("hidden");
    gachaCloseBtn.classList.remove("hidden");
    checkNewUnlocks();
    updateHeader();
    if(activeTab==="auto") renderPanel();
  }

  gachaCloseBtn.addEventListener("click", ()=>{
    gachaOverlay.classList.remove("show");
  });

  // ---------- LOCATION TRAVEL ----------
  function travelTo(index){
    if(index === state.currentLocation) return;
    const loc = LOCATIONS[index];
    const rect = rockWrap.getBoundingClientRect();
    const px = ((rect.left+rect.width/2)/window.innerWidth*100).toFixed(1)+"%";
    const py = ((rect.top+rect.height/2)/window.innerHeight*100).toFixed(1)+"%";
    portalEl.style.setProperty("--px", px);
    portalEl.style.setProperty("--py", py);
    portalEl.style.setProperty("--portal-color", loc.accent);
    portalEl.classList.remove("active");
    void portalEl.offsetWidth;
    portalEl.classList.add("active");

    playTravel();
    if(!reducedMotion) rockWrap.classList.add("flipping");
    oreStage = 0;
    rockWrap.classList.remove("stage1","stage2");

    const flipDelay = reducedMotion ? 60 : 280;
    setTimeout(()=>{
      state.currentLocation = index;
      applyLocationVisual();
      updateHeader();
      const r2 = LOCATIONS[index].accent2;
      const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
      burstAtViewportPoint(cx, cy, r2, reducedMotion ? 6 : 16);
    }, flipDelay);

    setTimeout(()=>{
      rockWrap.classList.remove("flipping");
      portalEl.classList.remove("active");
      save();
      renderPanel();
      // A finished travel transition is the one moment nothing is mid-swing
      // or mid-reel — the natural "logical pause" for an interstitial (4.4).
      maybeShowInterstitial();
    }, reducedMotion ? 260 : 920);
  }

  rockWrap.addEventListener("click", (e)=>{
    startMusic();
    const power = clickPower();
    onEarn(power);
    if(activeTab === "click") renderPanel();

    const rect = rockWrap.getBoundingClientRect();
    const x = (e.clientX ?? rect.left+rect.width/2) - rect.left;
    const y = (e.clientY ?? rect.top+rect.height/2) - rect.top;
    spawnFloatNum(x,y,power);
    swingPickaxe(x,y);
    advanceOreStage();
    maybeDropChest();

    rockWrap.classList.remove("shake");
    void rockWrap.offsetWidth;
    rockWrap.classList.add("shake");

    save();
  });

  muteBtn.addEventListener("click", ()=>{
    state.muted = !state.muted;
    if(!state.muted) getCtx();
    startMusic();
    setMusicMuted(state.muted);
    updateHeader(); save();
  });

  adBtn.addEventListener("click", showRewardedBonus);

  tabBtns.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      tabBtns.forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      activeTab = btn.dataset.tab;
      renderPanel();
    });
  });

  let lastTick = Date.now();
  setInterval(()=>{
    const now = Date.now();
    const dt = (now-lastTick)/1000;
    lastTick = now;
    const gain = perSecond()*dt;
    if(gain > 0) onEarn(gain);
  }, 200);

  setInterval(save, 5000);

  function applyOfflineProgress(){
    const tsKey = SAVE_KEY+"_ts";
    const lastSeen = Number(localStorage.getItem(tsKey) || Date.now());
    const now = Date.now();
    const seconds = Math.min((now-lastSeen)/1000, 60*60*4);
    if(seconds > 5){
      const gain = perSecond()*seconds;
      state.resources += gain;
      state.totalEarned += gain;
      if(gain >= 1) showToast("Пока тебя не было, шахтёры добыли +" + fmt(gain) + " 💎");
    }
    localStorage.setItem(tsKey, String(now));
  }
  window.addEventListener("beforeunload", ()=>{
    localStorage.setItem(SAVE_KEY+"_ts", String(Date.now()));
    save();
  });

  // ---------- INIT ----------
  load();
  applyOfflineProgress();
  seenUnlockedCount = unlockedCount();
  applyLocationVisual();
  updateHeader();
  renderPanel();
  startAmbient();
  preloadAudio();
  graStart();
  if(window.__yandexPlayer) syncCloudSave();
})();
</script>
</body>
</html>
