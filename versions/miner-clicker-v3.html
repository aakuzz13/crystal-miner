<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0705">
<title>Кристальная Шахта — Гримуар Забоя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark:#1c130d;
    --wood-mid:#33241a;
    --wood-light:#4d3826;
    --parchment:#d8c69c;
    --parchment-dark:#b9a578;
    --parchment-panel:#2a2018;
    --ink:#241a12;
    --ink-dim:#8c7a5e;
    --blood:#6e1f1f;
    --blood-bright:#9c3232;
    --candle:#d99a4e;
    --candle-bright:#f2bd72;
    --common:#8a8478;    --common2:#c2bcae;
    --rare:#3d6b84;      --rare2:#7fb0c9;
    --epic:#6b3d84;      --epic2:#af7fc9;
    --legendary:#a8792f; --legendary2:#e8bd68;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:radial-gradient(ellipse at 50% 0%, #1a120c, #0a0705);
    transition:background 0.7s ease;
    font-family:'IM Fell English', Georgia, serif;
    color:var(--parchment);
  }
  #app{ display:flex; flex-direction:column; height:100%; position:relative; }

  /* GRAIN + VIGNETTE */
  #grain{
    position:fixed; inset:0; z-index:60; pointer-events:none;
    background-image:var(--grain-tile);
    background-size:180px 180px;
    mix-blend-mode:overlay; opacity:.16;
  }
  #vignette{
    position:fixed; inset:0; z-index:59; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, transparent 38%, rgba(0,0,0,.35) 78%, rgba(0,0,0,.72) 100%);
  }

  /* PORTAL TRANSITION OVERLAY */
  #portal{
    position:fixed; inset:0; z-index:45; pointer-events:none; opacity:0;
    background:radial-gradient(circle at var(--px,50%) var(--py,50%), var(--portal-color,#fff) 0%, transparent 65%);
  }
  #portal.active{ animation: portalExpand 0.9s cubic-bezier(.16,.84,.44,1) forwards; }
  @keyframes portalExpand{
    0%{ clip-path: circle(0% at var(--px) var(--py)); opacity:.9; }
    60%{ opacity:.8; }
    100%{ clip-path: circle(145% at var(--px) var(--py)); opacity:0; }
  }

  /* HEADER */
  header{ position:relative; padding:12px 16px 10px; text-align:center; flex-shrink:0; }
  .icon-btn{
    position:absolute; top:8px; right:12px;
    background:linear-gradient(160deg, var(--wood-light), var(--wood-dark));
    border:1px solid #000a; border-radius:50%;
    width:34px; height:34px; font-size:1rem; color:var(--parchment);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.08);
  }
  .torch{ position:absolute; top:9px; width:24px; height:24px; image-rendering:pixelated; pointer-events:none;
    filter:drop-shadow(0 0 7px rgba(217,154,78,.65)); animation:torchFlicker 1.8s ease-in-out infinite; }
  .torch-left{ left:14px; }
  .torch-right{ right:54px; animation-delay:.6s; }
  @keyframes torchFlicker{ 0%,100%{opacity:.82; transform:scale(1);} 50%{opacity:1; transform:scale(1.06);} }
  .loc-label{ font-family:'Pirata One',Georgia,serif; font-weight:400; font-size:0.92rem; color:var(--parchment-dark); letter-spacing:0.6px; }
  .loc-tagline{ font-family:'IM Fell English',serif; font-style:italic; font-size:0.7rem; color:var(--ink-dim); opacity:.9; margin-top:2px; }
  .resource-panel{
    display:inline-block; margin-top:8px; padding:7px 22px 9px; border-radius:4px;
    background:linear-gradient(160deg, rgba(255,220,160,.08), rgba(0,0,0,.3));
    border:1px solid rgba(217,154,78,0.35);
    box-shadow:0 0 18px rgba(217,154,78,0.1) inset, 0 3px 8px rgba(0,0,0,.5);
  }
  .resource-counter{ font-family:'Pirata One',Georgia,serif; font-size:1.85rem; font-weight:400; color:var(--candle-bright); text-shadow:0 0 16px rgba(217,154,78,0.55); letter-spacing:0.5px; }
  .resource-counter span.unit{ font-size:1rem; color:var(--ink-dim); font-weight:normal; }
  .per-sec{ font-size:0.8rem; color:var(--parchment-dark); margin-top:1px; font-family:'IM Fell English',serif; font-style:italic; }

  /* TOAST */
  #toast{
    position:fixed; top:10px; left:50%; transform:translateX(-50%) translateY(-30px);
    background:linear-gradient(160deg, var(--wood-mid), var(--wood-dark)); border:1px solid rgba(217,154,78,0.3);
    color:var(--parchment); padding:9px 16px; border-radius:4px;
    font-family:'IM Fell English',serif; font-size:0.85rem; font-weight:600;
    opacity:0; transition:all 0.35s ease; pointer-events:none; white-space:nowrap; z-index:50;
    box-shadow:0 4px 10px rgba(0,0,0,.5);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* MAIN */
  main{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-height:0; }
  .ambient-particle{ position:absolute; border-radius:50%; pointer-events:none; z-index:0; animation:ambientFloat linear forwards; }
  @keyframes ambientFloat{
    0%{ transform:translateY(10px) scale(0.7); opacity:0; }
    15%{ opacity:.8; }
    85%{ opacity:.4; }
    100%{ transform:translateY(-130px) scale(0.4); opacity:0; }
  }

  #rock-wrap{
    --accent:#7c6a9c; --accent2:#a99bc4; --rockBase:#362c2a; --rockDeep:#1c1614;
    position:relative; perspective:900px;
    width:min(66vw, 250px); height:min(66vw, 250px);
    cursor:pointer; touch-action:manipulation;
  }
  #rock-wrap::before{
    content:""; position:absolute; inset:-7%; border-radius:50%; z-index:0; pointer-events:none;
    border:2px solid color-mix(in srgb, var(--accent) 45%, transparent);
    box-shadow:0 0 0 6px color-mix(in srgb, var(--accent) 10%, transparent) inset;
    transition:border-color .6s ease, box-shadow .6s ease;
  }
  #rock-glow{
    position:absolute; inset:-25%; border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, transparent 68%);
    opacity:0.28; filter:blur(18px); z-index:0; pointer-events:none;
    animation:glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse{ 0%,100%{opacity:0.18; transform:scale(0.94);} 50%{opacity:0.34; transform:scale(1.05);} }
  #rock{ position:relative; z-index:1; width:100%; height:100%; transition:transform 0.08s ease; }
  #rock-wrap:active #rock{ transform:scale(0.94); }
  #rock-wrap.shake #rock{ animation:shake 0.22s; }
  @keyframes shake{ 0%,100%{transform:translate(0,0);} 25%{transform:translate(-3px,2px) rotate(-1deg);} 75%{transform:translate(3px,-2px) rotate(1deg);} }
  #rock-wrap.flipping #rock{ animation:rockFlip 0.56s ease-in-out; }
  @keyframes rockFlip{ 0%{transform:rotateY(0deg);} 50%{transform:rotateY(92deg);} 100%{transform:rotateY(0deg);} }
  .crystal{ animation:crystalPulse 2.6s ease-in-out infinite; transform-origin:center; }
  .crystal:nth-of-type(2){ animation-delay:0.3s; }
  .crystal:nth-of-type(3){ animation-delay:0.6s; }
  .crystal:nth-of-type(4){ animation-delay:0.9s; }
  @keyframes crystalPulse{ 0%,100%{opacity:0.78;} 50%{opacity:1;} }
  .sparkle{ animation:twinkle 1.8s ease-in-out infinite; transform-origin:center; }
  @keyframes twinkle{ 0%,100%{opacity:0; transform:scale(0.4);} 50%{opacity:1; transform:scale(1);} }

  #cracksStage1 path, #cracksStage2 path{ opacity:0; transition:opacity .25s ease; }
  #rock-wrap.stage1 #cracksStage1 path{ opacity:1; }
  #rock-wrap.stage2 #cracksStage1 path, #rock-wrap.stage2 #cracksStage2 path{ opacity:1; }
  #shatterFlash{ opacity:0; }
  #rock-wrap.shatter #shatterFlash{ animation:shatterFlash .5s ease-out; }
  @keyframes shatterFlash{ 0%{opacity:0;} 12%{opacity:.9;} 100%{opacity:0;} }

  /* PICKAXE */
  #pickaxe{
    position:absolute; width:44%; height:44%; right:-8%; top:2%;
    transform-origin:22% 88%; transform:rotate(-14deg);
    z-index:3; pointer-events:none;
    filter:drop-shadow(2px 3px 3px rgba(0,0,0,.6));
  }
  @keyframes pickaxeSwing{
    0%{ transform:rotate(-14deg); }
    26%{ transform:rotate(-72deg); }
    46%{ transform:rotate(38deg); }
    68%{ transform:rotate(18deg); }
    100%{ transform:rotate(-14deg); }
  }
  #pickaxe.swing{ animation:pickaxeSwing .4s cubic-bezier(.3,0,.2,1); }

  .float-num{
    position:absolute; font-size:1.25rem; font-weight:bold; color:var(--candle-bright);
    text-shadow:0 1px 3px rgba(0,0,0,0.7); pointer-events:none;
    animation:floatUp 0.9s ease-out forwards; font-family:'IM Fell English',serif; z-index:8;
  }
  @keyframes floatUp{ 0%{opacity:1; transform:translateY(0) scale(1);} 100%{opacity:0; transform:translateY(-70px) scale(1.2);} }

  .chip{ position:absolute; width:6px; height:6px; border-radius:1px; pointer-events:none; z-index:6; }
  .spark{ position:absolute; width:3px; height:3px; border-radius:50%; pointer-events:none; z-index:7; background:var(--candle-bright); box-shadow:0 0 5px var(--candle-bright); }
  .dust-chunk{ position:absolute; pointer-events:none; z-index:6; image-rendering:pixelated; }

  .ore-accent{ position:absolute; width:20px; height:20px; image-rendering:pixelated; z-index:1; pointer-events:none; opacity:.9; filter:drop-shadow(0 0 4px rgba(0,0,0,.55)); }
  .oa1{ left:26%; top:36%; }
  .oa2{ right:22%; top:56%; }
  .rockpile-decor{ position:absolute; width:34px; height:30px; left:50%; bottom:-4%; transform:translateX(-50%); image-rendering:pixelated; opacity:.8; z-index:0; pointer-events:none; }

  /* CHEST */
  #chest{
    position:absolute; width:52px; height:44px; z-index:9; cursor:pointer;
    right:8%; bottom:4%; filter:drop-shadow(2px 3px 3px rgba(0,0,0,.6));
    animation:chestBob 1.6s ease-in-out infinite;
  }
  #chest.hidden{ display:none; }
  #chest.opening{ animation:none; pointer-events:none; }
  #chest.opening #chestLidGroup{ animation:chestLidOpen .35s ease-in forwards; }
  #chest.opening{ animation:chestVanish .45s ease-in .3s forwards; }
  @keyframes chestBob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }
  @keyframes chestLidOpen{ 0%{transform:rotate(0deg);} 100%{transform:rotate(-70deg);} }
  @keyframes chestVanish{ 0%{opacity:1; transform:scale(1);} 100%{opacity:0; transform:scale(0.6) translateY(-10px);} }

  /* NAV */
  nav{ display:flex; flex-shrink:0; border-top:1px solid rgba(217,154,78,0.15); background:linear-gradient(180deg, var(--wood-mid), var(--wood-dark)); }
  nav button{ flex:1; padding:11px 4px; background:none; border:none; color:var(--ink-dim); font-family:'IM Fell English SC',serif; font-size:0.76rem; font-weight:600; letter-spacing:0.4px; border-bottom:3px solid transparent; }
  nav button.active{ color:var(--candle-bright); border-bottom-color:var(--candle); text-shadow:0 0 8px rgba(217,154,78,0.4); }

  /* PANEL */
  #panel{
    flex-shrink:0; height:40vh; max-height:340px; overflow-y:auto; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 26px),
      linear-gradient(180deg, var(--wood-mid), var(--wood-dark));
    border-top:1px solid rgba(0,0,0,.4);
  }

  /* CARDS — parchment/etched */
  .card{
    --r:var(--common); --r2:var(--common2);
    position:relative; overflow:hidden;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(0,0,0,.12), transparent 55%),
      radial-gradient(ellipse at 85% 80%, rgba(0,0,0,.1), transparent 55%),
      linear-gradient(160deg, color-mix(in srgb, var(--r) 14%, var(--parchment)), var(--parchment-dark));
    border:1.5px solid color-mix(in srgb, var(--r) 60%, #241a12 40%);
    border-radius:3px; padding:12px 13px; margin-bottom:10px;
    font-family:'IM Fell English',serif; color:var(--ink);
    box-shadow:0 0 0 1px rgba(0,0,0,0.25) inset, 0 3px 10px rgba(0,0,0,0.45);
    transition:opacity .15s, transform .1s, box-shadow .3s;
  }
  .card.disabled{ opacity:.6; }
  .card:active{ transform:scale(0.985); }
  @media (hover:hover){ .card:not(.disabled):hover{ transform:translateY(-2px); box-shadow:0 5px 14px rgba(0,0,0,0.5); } }

  .card.rarity-common{ --r:var(--common); --r2:var(--common2); }
  .card.rarity-rare{ --r:var(--rare); --r2:var(--rare2); }
  .card.rarity-epic{ --r:var(--epic); --r2:var(--epic2); }
  .card.rarity-legendary{ --r:var(--legendary); --r2:var(--legendary2); animation:legendaryPulse 2.6s ease-in-out infinite; }
  @keyframes legendaryPulse{
    0%,100%{ box-shadow:0 0 10px 1px color-mix(in srgb, var(--legendary) 40%, transparent), 0 3px 10px rgba(0,0,0,.45); }
    50%{ box-shadow:0 0 18px 4px color-mix(in srgb, var(--legendary) 55%, transparent), 0 3px 10px rgba(0,0,0,.45); }
  }

  /* wax seal instead of pill */
  .wax-seal{
    position:absolute; top:8px; right:8px; width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--r) 70%, white 10%), color-mix(in srgb, var(--r) 70%, black 25%));
    box-shadow:0 2px 3px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center;
    font-size:0.85rem; color:rgba(255,255,255,.85); z-index:2;
  }
  .wax-seal::after{
    content:""; position:absolute; inset:3px; border-radius:50%;
    border:1px dashed rgba(255,255,255,.25);
  }

  .card-top{ display:flex; align-items:center; gap:10px; margin-bottom:7px; position:relative; z-index:1; padding-right:38px; }
  .card-icon{
    width:42px; height:42px; border-radius:4px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:1.35rem;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--r) 45%, white 10%), color-mix(in srgb, var(--r) 45%, black 20%));
    box-shadow:0 0 8px color-mix(in srgb, var(--r) 45%, transparent), inset 0 0 0 1px rgba(0,0,0,.3);
  }
  .card-head{ min-width:0; flex:1; }
  .card-name{ font-family:'Pirata One',Georgia,serif; font-weight:400; font-size:1rem; color:var(--ink); letter-spacing:.2px; }
  .card-rarity-label{ margin-top:2px; font-size:0.66rem; font-weight:700; letter-spacing:.4px; color:color-mix(in srgb, var(--r) 65%, black 35%); text-transform:uppercase; }
  .card-flavor{ font-style:italic; font-size:0.74rem; color:color-mix(in srgb, var(--ink) 70%, transparent); margin-bottom:6px; position:relative; z-index:1; }
  .card-desc{ font-size:0.8rem; color:var(--ink); opacity:.92; margin-bottom:8px; position:relative; z-index:1; }
  .card-footer{ display:flex; align-items:center; justify-content:space-between; gap:8px; position:relative; z-index:1; }
  .card-level{ font-size:0.72rem; color:color-mix(in srgb, var(--ink) 75%, transparent); display:flex; align-items:center; gap:6px; }
  .level-pips{ color:color-mix(in srgb, var(--r) 70%, black 20%); letter-spacing:1px; font-size:0.7rem; }
  .card-buy{
    flex-shrink:0; border:none; border-radius:4px; padding:9px 14px; font-weight:700; font-size:0.82rem;
    color:#fbf1de; background:linear-gradient(180deg, color-mix(in srgb, var(--r) 55%, black 5%), color-mix(in srgb, var(--r) 55%, black 30%));
    font-family:'IM Fell English',serif;
    cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,0.4);
  }
  .card-buy:focus-visible{ outline:2px solid var(--candle-bright); outline-offset:2px; }
  .card.disabled .card-buy{ background:#4a3d2c; color:#8c7a5e; box-shadow:none; }
  .card-buy:disabled{ background:#4a3d2c; color:#8c7a5e; box-shadow:none; cursor:default; opacity:.85; }

  .loc-progress{ height:7px; background:rgba(0,0,0,0.25); border-radius:3px; overflow:hidden; margin:6px 0 2px; }
  .loc-progress-fill{ height:100%; background:linear-gradient(90deg,var(--r),var(--r2)); box-shadow:0 0 8px color-mix(in srgb, var(--r2) 60%, transparent); transition:width .3s ease; }

  .miner-sprite{ width:20px; height:20px; image-rendering:pixelated; vertical-align:middle; }

  /* GACHA MODAL */
  #gacha-overlay{
    position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center;
    background:rgba(6,4,3,0.82); opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  #gacha-overlay.show{ opacity:1; pointer-events:auto; }
  .gacha-card{
    width:min(92vw, 360px); border-radius:6px; padding:20px 18px;
    background:linear-gradient(160deg, var(--wood-light), var(--wood-dark));
    border:2px solid #000a; box-shadow:0 10px 40px rgba(0,0,0,.7), inset 0 0 0 1px rgba(217,154,78,.15);
    text-align:center;
  }
  .gacha-title{ font-family:'Pirata One',Georgia,serif; color:var(--candle-bright); font-size:1.2rem; margin-bottom:14px; text-shadow:0 0 10px rgba(217,154,78,.4); }
  .reel-viewport{ position:relative; width:266px; height:76px; margin:0 auto 16px; overflow:hidden; border-radius:4px; background:rgba(0,0,0,.4); box-shadow:inset 0 0 12px rgba(0,0,0,.7), 0 0 0 1px rgba(217,154,78,.25); }
  .reel-track{ position:absolute; top:0; left:0; height:100%; display:flex; will-change:transform; }
  .reel-item{ position:relative; width:66px; height:66px; margin:5px; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1.8rem; overflow:hidden;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--r) 55%, white 10%), color-mix(in srgb, var(--r) 55%, black 20%));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);
  }
  .reel-figure{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; image-rendering:pixelated; opacity:.4; mix-blend-mode:multiply; }
  .reel-emoji{ position:relative; z-index:1; filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .reel-marker{ position:absolute; left:50%; top:-4px; bottom:-4px; width:2px; transform:translateX(-1px); background:var(--blood-bright); box-shadow:0 0 8px var(--blood-bright); }
  .reel-marker::before, .reel-marker::after{ content:""; position:absolute; left:50%; width:0; height:0; transform:translateX(-50%); border:6px solid transparent; }
  .reel-marker::before{ top:-6px; border-top-color:var(--blood-bright); }
  .reel-marker::after{ bottom:-6px; border-bottom-color:var(--blood-bright); }

  .gacha-result{ min-height:110px; }
  .gacha-result.hidden{ display:none; }
  .result-seal{
    width:74px; height:74px; border-radius:50%; margin:0 auto 10px;
    display:flex; align-items:center; justify-content:center; font-size:2.1rem;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--r) 60%, white 15%), color-mix(in srgb, var(--r) 60%, black 20%));
    box-shadow:0 0 22px color-mix(in srgb, var(--r) 55%, transparent), inset 0 0 0 2px rgba(0,0,0,.35);
    animation:resultPop .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes resultPop{ 0%{ transform:scale(0.3); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  .result-name{ font-family:'Pirata One',Georgia,serif; color:var(--parchment); font-size:1.15rem; }
  .result-rarity{ font-size:0.72rem; letter-spacing:.5px; text-transform:uppercase; margin-top:2px; color:color-mix(in srgb, var(--r) 70%, white 20%); }
  .result-stat{ margin-top:8px; font-size:0.85rem; color:var(--candle-bright); }
  .result-roll{ font-size:0.72rem; color:var(--ink-dim); margin-top:2px; }
  .gacha-close{
    margin-top:16px; border:none; border-radius:4px; padding:10px 22px; font-weight:700; font-size:0.85rem;
    color:#fbf1de; background:linear-gradient(180deg, var(--blood-bright), var(--blood)); font-family:'IM Fell English',serif;
    cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,0.4);
  }
  .gacha-close.hidden{ display:none; }

  #legendary-flash{ position:fixed; inset:0; z-index:69; background:#fff; opacity:0; pointer-events:none; }
  #legendary-flash.flash{ animation:legendFlash 1.1s ease-out; }
  @keyframes legendFlash{ 0%{opacity:0;} 8%{opacity:.95;} 30%{opacity:.15;} 45%{opacity:.5;} 60%{opacity:.05;} 100%{opacity:0;} }
  #gacha-overlay.legendary .gacha-card{ box-shadow:0 0 60px rgba(232,189,104,.5), 0 10px 40px rgba(0,0,0,.7); }
  #gacha-overlay.legendary .result-name{ font-size:1.4rem; text-shadow:0 0 14px rgba(232,189,104,.6); }

  @media (prefers-reduced-motion: reduce){
    #portal.active{ animation:none; opacity:.5; transition:opacity .25s ease; }
    #rock-wrap.flipping #rock{ animation:none; }
    .card.rarity-legendary{ animation:none; }
    .ambient-particle{ display:none; }
    #rock-glow{ animation:none; }
    .crystal{ animation:none; }
    #pickaxe.swing{ animation:none; }

<script>
(function(){
  "use strict";

  const SAVE_KEY = "crystal_mine_v3_save";
  const ASSET_SPRITES = "../assets/sprites/";
  const ASSET_SOUNDS = "../assets/sounds/";

  let state = {
    resources: 0,
    totalEarned: 0,
    clickLevel: 0,
    shopCounts: [0,0,0,0],
    gachaMiners: [],
    currentLocation: 0,
    muted: false,
  };

  // ---------- STATIC DATA (economy unchanged from v2) ----------
  const clickUpgrade = {
    name:"Верная кирка", icon:"⛏", baseCost:15, costMult:1.15, baseValue:1,
    flavor:"Растёт вместе с тобой, будто вросла в руку"
  };

  const autoDefs = [
    { name:"Ученик рудокоп",   icon:"🧑‍🔧", baseCost:25,   costMult:1.16, rate:0.3, rarity:"common",    flavor:"Ещё вчера боялся темноты" },
    { name:"Кирка-автомат",    icon:"🤖",   baseCost:150,  costMult:1.17, rate:2,   rarity:"rare",      flavor:"Ковка забытых мастеров" },
    { name:"Буровая установка",icon:"🛠",   baseCost:900,  costMult:1.18, rate:9,   rarity:"epic",      flavor:"Пробивает камень будто плоть" },
    { name:"Древний голем",    icon:"🗿",   baseCost:5000, costMult:1.2,  rate:40,  rarity:"legendary", flavor:"Спит тысячу лет между ударами" },
  ];

  const LOCATIONS = [
    { id:"cave",  name:"Пещера кристаллов", icon:"💎", tagline:"Здесь всё начиналось",  unlockAt:0,       bg:["#1c1512","#0d0a08"], accent:"#7c6a9c", accent2:"#a99bc4", rockBase:"#362c2a", rockDeep:"#1c1614", ore:"ore_purple" },
    { id:"gold",  name:"Золотая шахта",     icon:"🪙", tagline:"Блеск, который не ржавеет", unlockAt:1000,    bg:["#241c10","#120e08"], accent:"#a8823f", accent2:"#d4ac6a", rockBase:"#3f3323", rockDeep:"#201a12", ore:"ore_gold" },
    { id:"ice",   name:"Ледяная пещера",    icon:"❄️", tagline:"Холод, который жжётся",  unlockAt:20000,   bg:["#101c1e","#080e0f"], accent:"#5f8a94", accent2:"#a8ccd0", rockBase:"#2c3a3d", rockDeep:"#161e20", ore:"ore_silver" },
    { id:"lava",  name:"Огненные недра",    icon:"🔥", tagline:"Осторожно, здесь жарко", unlockAt:250000,  bg:["#1f1109","#100905"], accent:"#9c4a34", accent2:"#d47a52", rockBase:"#3d2620", rockDeep:"#1e1310", ore:"ore_orange" },
    { id:"space", name:"Звёздный астероид", icon:"✨", tagline:"Дальше только звёзды",   unlockAt:3000000, bg:["#12101c","#08070d"], accent:"#6a5a94", accent2:"#a89bc9", rockBase:"#262038", rockDeep:"#14101d", ore:"ore_green" },
  ];

  const RARITY = {
    common:    { label:"Обычная",    seal:"●" },
    rare:      { label:"Редкая",     seal:"◆" },
    epic:      { label:"Эпическая",  seal:"★" },
    legendary: { label:"Легендарная",seal:"♛" },
  };

  const GACHA_WEIGHTS = { common:60, rare:28, epic:10, legendary:2 };
  const CHEST_DROP_CHANCE = 0.045;
  const STAT_ROLL_RANGE = 0.2; // ±20%

  function toolRarity(level){
    if(level>=50) return "legendary";
    if(level>=25) return "epic";
    if(level>=10) return "rare";
    return "common";
  }

  // ---------- PERSISTENCE ----------
  function load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(raw) state = Object.assign(state, JSON.parse(raw));
    }catch(e){}
    if(!Array.isArray(state.shopCounts) || state.shopCounts.length!==4) state.shopCounts=[0,0,0,0];
    if(!Array.isArray(state.gachaMiners)) state.gachaMiners=[];
    if(!LOCATIONS[state.currentLocation] || state.totalEarned < LOCATIONS[state.currentLocation].unlockAt){
      state.currentLocation = 0;
    }
  }
  function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }

  // ---------- ECONOMY MATH (unchanged formulas from v2) ----------
  function costFor(base, mult, level){ return Math.ceil(base * Math.pow(mult, level)); }
  function unlockedCount(){ return LOCATIONS.filter(l=> state.totalEarned >= l.unlockAt).length; }
  function locationBonusMult(){ return 1 + 0.15*(unlockedCount()-1); }
  function clickPower(){ return (1 + state.clickLevel*clickUpgrade.baseValue) * locationBonusMult(); }
  function perSecond(){
    let total=0;
    autoDefs.forEach((d,i)=> total += d.rate*state.shopCounts[i]);
    state.gachaMiners.forEach(m=> total += m.rate);
    return total * locationBonusMult();
  }
  function minerCountFor(i){
    return state.shopCounts[i] + state.gachaMiners.filter(m=>m.defIndex===i).length;
  }
  function minerRateFor(i){
    let t = autoDefs[i].rate*state.shopCounts[i];
    state.gachaMiners.forEach(m=>{ if(m.defIndex===i) t += m.rate; });
    return t;
  }

  function fmt(n){
    n = Math.floor(n);
    if(n < 1000) return String(n);
    if(n < 1e6) return (n/1e3).toFixed(2).replace(/\.00$/,'') + "K";
    if(n < 1e9) return (n/1e6).toFixed(2).replace(/\.00$/,'') + "M";
    return (n/1e9).toFixed(2).replace(/\.00$/,'') + "B";
  }
  function fmtPrecise(n){
    if(n < 1000){ const r = Math.round(n*10)/10; return (r%1===0) ? String(r) : r.toFixed(1); }
    return fmt(n);
  }
  function pips(level){
    const filled = Math.min(level,5);
    let s = "●".repeat(filled) + "○".repeat(Math.max(0,5-filled));
    if(level>5) s += " +"+(level-5);
    return s;
  }

  // ---------- AUDIO ----------
  let audioCtx = null;
  const sampleCache = {};
  let reverbNode = null;
  function getCtx(){
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function buildReverb(ctx){
    const len = ctx.sampleRate * 1.1;
    const impulse = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for(let i=0;i<len;i++){
        data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.6);
      }
    }
    const conv = ctx.createConvolver();
    conv.buffer = impulse;
    const wet = ctx.createGain();
    wet.gain.value = 0.22;
    conv.connect(wet).connect(ctx.destination);
    return { input: conv, wet };
  }
  function loadSample(name, file){
    sampleCache[name] = fetch(ASSET_SOUNDS+file)
      .then(r=> r.ok ? r.arrayBuffer() : Promise.reject())
      .then(buf=> getCtx().decodeAudioData(buf))
      .catch(()=> null);
  }
  function preloadAudio(){
    [
      ["hit0","impactMining_000.ogg"], ["hit1","impactMining_001.ogg"], ["hit2","impactMining_002.ogg"],
      ["hit3","impactMining_003.ogg"], ["hit4","impactMining_004.ogg"],
      ["chestDrop","impactSoft_heavy_000.ogg"], ["chestOpen0","open_001.ogg"], ["chestOpen1","open_002.ogg"],
      ["chestClose","close_002.ogg"], ["tick0","tick_001.ogg"], ["tick1","tick_002.ogg"], ["tick2","tick_004.ogg"],
      ["confirm","confirmation_002.ogg"], ["bell0","impactBell_heavy_000.ogg"], ["bell1","impactBell_heavy_001.ogg"],
    ].forEach(([n,f])=> loadSample(n,f));
  }
  async function playSample(name, {rate=1, gain=0.5, dry=0.75}={}){
    if(state.muted) return;
    const buf = await sampleCache[name];
    if(!buf) return;
    const ctx = getCtx();
    if(!reverbNode) reverbNode = buildReverb(ctx);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = rate * (0.96 + Math.random()*0.08);
    const g = ctx.createGain();
    g.gain.value = gain;
    src.connect(g);
    g.connect(ctx.destination);
    const wetGain = ctx.createGain();
    wetGain.gain.value = gain*(1-dry);
    g.connect(wetGain).connect(reverbNode.input);
    src.start();
  }
  function tone(freq, start, dur, type, peak){
    if(state.muted) return;
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const lp = ctx.createBiquadFilter();
    lp.type="lowpass"; lp.frequency.value = 1600;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime+start);
    gain.gain.setValueAtTime(0, ctx.currentTime+start);
    gain.gain.linearRampToValueAtTime(peak, ctx.currentTime+start+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
    osc.connect(lp).connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime+start);
    osc.stop(ctx.currentTime+start+dur+0.03);
  }
  function playMiningHit(){ playSample("hit"+Math.floor(Math.random()*5), {gain:0.55}); }
  function playChestDrop(){ playSample("chestDrop", {gain:0.5}); }
  function playChestOpen(){ playSample(Math.random()<0.5?"chestOpen0":"chestOpen1", {gain:0.55}); }
  function playChestClose(){ playSample("chestClose", {gain:0.4}); }
  function playTick(){ playSample("tick"+Math.floor(Math.random()*3), {gain:0.35, rate:1+Math.random()*0.15}); }
  function playConfirm(){ playSample("confirm", {gain:0.5}); }
  function playLegendaryBell(){ playSample(Math.random()<0.5?"bell0":"bell1", {gain:0.6, dry:0.5}); }
  function playBuy(rarity){
    if(rarity==="epic"){ tone(494,0,0.1,'triangle',0.06); tone(659,0.1,0.16,'triangle',0.07); }
    else if(rarity==="legendary"){ playLegendaryBell(); }
    else { tone(420,0,0.1,'triangle',0.05); }
  }
  function playTravel(){
    if(state.muted) return;
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(560, ctx.currentTime+0.55);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.05, ctx.currentTime+0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.6);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.65);
  }
  function playUnlock(){ playConfirm(); }
  document.addEventListener("visibilitychange", ()=>{
    if(!audioCtx) return;
    if(document.hidden) audioCtx.suspend(); else audioCtx.resume();
  });

  // ---------- PROCEDURAL TEXTURES ----------
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function makeValueNoise(rng, gridSize){
    const grid = [];
    for(let y=0;y<=gridSize;y++){ const row=[]; for(let x=0;x<=gridSize;x++) row.push(rng()); grid.push(row); }
    return function(u,v){ // u,v in [0,1)
      const gx = u*gridSize, gy = v*gridSize;
      const x0=Math.floor(gx), y0=Math.floor(gy);
      const x1=Math.min(x0+1,gridSize), y1=Math.min(y0+1,gridSize);
      const fx=gx-x0, fy=gy-y0;
      const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
      const a=grid[y0][x0], b=grid[y0][x1], c=grid[y1][x0], d=grid[y1][x1];
      return (a*(1-sx)+b*sx)*(1-sy) + (c*(1-sx)+d*sx)*sy;
    };
  }
  function hexToRgb(hex){
    const n = parseInt(hex.replace('#',''),16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  function lerpColor(c1,c2,t){ return [0,1,2].map(i=> Math.round(c1[i]+(c2[i]-c1[i])*t)); }

  const textureCache = {};
  function generateLocationTexture(loc, size){
    size = size || 220;
    const key = loc.id+"_"+size;
    if(textureCache[key]) return textureCache[key];
    const rng = mulberry32(loc.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0)*7919 + size);
    const noiseCoarse = makeValueNoise(rng, 6);
    const noiseFine = makeValueNoise(rng, 22);
    const base = hexToRgb(loc.rockBase), deep = hexToRgb(loc.rockDeep), acc = hexToRgb(loc.accent);
    const cvs = document.createElement('canvas');
    cvs.width = size; cvs.height = size;
    const ctx = cvs.getContext('2d');
    const img = ctx.createImageData(size,size);
    for(let y=0;y<size;y++){
      for(let x=0;x<size;x++){
        const u=x/size, v=y/size;
        const n1 = noiseCoarse(u,v);
        const n2 = noiseFine(u,v);
        const mix = Math.min(1, n1*0.7 + n2*0.35);
        let rgb = lerpColor(deep, base, mix);
        const speck = (n2-0.5)*26;
        rgb = rgb.map(c=> Math.max(0,Math.min(255, c+speck)));
        const idx=(y*size+x)*4;
        img.data[idx]=rgb[0]; img.data[idx+1]=rgb[1]; img.data[idx+2]=rgb[2]; img.data[idx+3]=255;
      }
    }
    ctx.putImageData(img,0,0);

    ctx.globalCompositeOperation = 'lighter';
    if(loc.id==="cave" || loc.id==="lava"){
      const veinCount = loc.id==="lava" ? 6 : 4;
      for(let i=0;i<veinCount;i++){
        ctx.beginPath();
        let x = rng()*size, y = rng()*size;
        ctx.moveTo(x,y);
        for(let s=0;s<5;s++){
          x += (rng()-0.5)*size*0.35; y += (rng()-0.5)*size*0.35;
          ctx.lineTo(x,y);
        }
        ctx.strokeStyle = `rgba(${acc[0]},${acc[1]},${acc[2]},${loc.id==="lava"?0.5:0.28})`;
        ctx.lineWidth = loc.id==="lava" ? 2.4 : 1.6;
        ctx.shadowColor = loc.accent; ctx.shadowBlur = loc.id==="lava"?8:5;
        ctx.stroke();
      }
    } else if(loc.id==="gold"){
      for(let i=0;i<140;i++){
        const x=rng()*size, y=rng()*size, r=rng()*1.4+0.3;
        ctx.beginPath(); ctx.arc(x,y,r,0,7);
        ctx.fillStyle = `rgba(${acc[0]},${acc[1]},${acc[2]},${0.25+rng()*0.35})`;
        ctx.fill();
      }
    } else if(loc.id==="ice"){
      for(let i=0;i<7;i++){
        ctx.beginPath();
        let x=rng()*size, y=rng()*size;
        ctx.moveTo(x,y);
        for(let s=0;s<4;s++){ x+=(rng()-0.5)*size*0.3; y+=(rng()-0.5)*size*0.3; ctx.lineTo(x,y); }
        ctx.strokeStyle = `rgba(${acc[0]},${acc[1]},${acc[2]},0.3)`;
        ctx.lineWidth=1; ctx.stroke();
      }
    } else if(loc.id==="space"){
      for(let i=0;i<90;i++){
        const x=rng()*size, y=rng()*size, r=rng()*1.1+0.2;
        ctx.beginPath(); ctx.arc(x,y,r,0,7);
        ctx.fillStyle = `rgba(255,255,255,${0.15+rng()*0.5})`;
        ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    const url = cvs.toDataURL('image/png');
    textureCache[key] = url;
    return url;
  }

    const img=ctx.createImageData(size,size);

      img.data[i*4]=v; img.data[i*4+1]=v; img.data[i*4+2]=v; img.data[i*4+3]=255;

  function accentHue(hex){
    // crude hue estimate to tint sprite chunks toward location accent
    const [r,g,b] = hexToRgb(hex||"#8b7cf0");
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    let h=0;
    if(max!==min){
      if(max===r) h=60*(((g-b)/(max-min))%6);
      else if(max===g) h=60*((b-r)/(max-min)+2);
      else h=60*((r-g)/(max-min)+4);
    }
    return Math.round(h);
  }

  function runParticle(el, x0, y0, vx, vy, life, gravity, rotSpeed){
    const start = performance.now();
    let rot = 0;
    function frame(now){
      const t = now-start;
      if(t>life){ el.remove(); return; }
      const tt = t; // ms
      const px = x0 + vx*(tt/1000);
      const py = y0 + vy*(tt/1000) + 0.5*gravity*tt*tt/1000;
      rot += rotSpeed;
      const fade = 1 - t/life;
      el.style.transform = `translate(${vx>=0?'':''}${px-x0}px, ${py-y0}px) rotate(${rot}deg)`;
      el.style.left = x0+"px"; el.style.top = y0+"px";
      el.style.opacity = Math.max(0, fade);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

      document.body.appendChild(chip);
      const angle = Math.random()*Math.PI*2;

      runParticle(chip, cx, cy, Math.cos(angle)*dist*2, Math.sin(angle)*dist*2-30, 650, 0.002, Math.random()*360);
    }
  }

  function rollRarity(){
    const total = Object.values(GACHA_WEIGHTS).reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    for(const rarity of Object.keys(GACHA_WEIGHTS)){
      const w = GACHA_WEIGHTS[rarity];
      if(r<w) return rarity;
      r -= w;
    }
    return "common";
  }

  const gachaOverlay = document.getElementById("gacha-overlay");

  const gachaCloseBtn = document.getElementById("gacha-close");
  const legendaryFlashEl = document.getElementById("legendary-flash");
  const REEL_ITEM_W = 76;
  const REEL_VIEWPORT_W = 266;
  const REEL_LEN = 26;

  function openGachaFlow(){
    const rarity = rollRarity();
    const defIndex = autoDefs.findIndex(d=>d.rarity===rarity);
    const def = autoDefs[defIndex];
    const roll = 1 - STAT_ROLL_RANGE + Math.random()*STAT_ROLL_RANGE*2;
    const rolledRate = def.rate * roll;
    state.gachaMiners.push({ defIndex, rate: rolledRate });
    save();

    gachaResultEl.classList.add("hidden");
    gachaCloseBtn.classList.add("hidden");
    gachaOverlay.classList.toggle("legendary", rarity==="legendary");
    gachaOverlay.classList.add("show");

    reelTrack.innerHTML = "";
    reelTrack.style.transform = "translateX(0px)";
    const strip = [];
    for(let i=0;i<REEL_LEN-1;i++){
      const rr = Object.keys(GACHA_WEIGHTS)[Math.floor(Math.random()*4)];
      strip.push(autoDefs.findIndex(d=>d.rarity===rr));
    }
    strip.push(defIndex);
    strip.forEach(idx=>{
      const d = autoDefs[idx];
      const item = document.createElement("div");
      item.className = "reel-item";
      item.style.setProperty("--r", "var(--"+d.rarity+")");
      const fig = document.createElement("img");
      fig.className = "reel-figure";

      const emoji = document.createElement("span");
      emoji.className = "reel-emoji";
      emoji.textContent = d.icon;
      item.appendChild(fig);
      item.appendChild(emoji);
      reelTrack.appendChild(item);
    });

    const centerOffset = REEL_VIEWPORT_W/2 - REEL_ITEM_W/2;
    const finalOffset = (REEL_LEN-1)*REEL_ITEM_W - centerOffset;
    const duration = rarity==="legendary" ? 4200 : 2300;
    const power = rarity==="legendary" ? 6 : 4;
    const start = performance.now();
    let lastIdx = -1;
    function frame(now){
      const t = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-t, power);
      const offset = eased*finalOffset;
      reelTrack.style.transform = `translateX(${-offset}px)`;
      const idx = Math.floor(offset/REEL_ITEM_W);
      if(idx !== lastIdx){ lastIdx = idx; playTick(); }
      if(t<1){ requestAnimationFrame(frame); }
      else { finishGachaReveal(def, rarity, rolledRate, roll); }
    }
    requestAnimationFrame(frame);
  }

      activeTab = btn.dataset.tab;
      renderPanel();
    });
  });

  let lastTick = Date.now();
  setInterval(()=>{
    const now = Date.now();
    const dt = (now-lastTick)/1000;
    lastTick = now;
    const gain = perSecond()*dt;
    if(gain > 0) onEarn(gain);
  }, 200);

  setInterval(save, 5000);

  function applyOfflineProgress(){
    const tsKey = SAVE_KEY+"_ts";
    const lastSeen = Number(localStorage.getItem(tsKey) || Date.now());
    const now = Date.now();
    const seconds = Math.min((now-lastSeen)/1000, 60*60*4);
    if(seconds > 5){
      const gain = perSecond()*seconds;
      state.resources += gain;
      state.totalEarned += gain;
      if(gain >= 1) showToast("Пока тебя не было, из забоя вынесли +" + fmt(gain) + " 💎");
    }
    localStorage.setItem(tsKey, String(now));
  }
  window.addEventListener("beforeunload", ()=>{
    localStorage.setItem(SAVE_KEY+"_ts", String(Date.now()));
    save();
  });

  // ---------- INIT ----------
  buildGrainTile();
  load();
  applyOfflineProgress();
  seenUnlockedCount = unlockedCount();
  applyLocationVisual();
  updateHeader();
  renderPanel();
  startAmbient();
  preloadAudio();
})();
</script>
</body>
</html>
